<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clothes Words</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2b3a;--acc:#ff7a45;--line:#ffd9a8;--ok:#2fb36b;--bad:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2233;--card:#2c3047;--ink:#f4f1ea;--line:#4a4f72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2233;--card:#2c3047;--ink:#f4f1ea;--line:#4a4f72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;height:100dvh}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Segoe UI",system-ui,sans-serif;height:100%;overflow:hidden}
main{max-width:1000px;height:100%;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
h1{font-size:1.2rem;margin:0;text-align:center}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel b{font-size:.9rem}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg{justify-content:center;margin-bottom:6px}
.chip,.sb{cursor:pointer;user-select:none;padding:5px 12px;border-radius:999px;border:2px solid var(--line);font:inherit;font-weight:700;font-size:.95rem;background:var(--card);color:var(--ink)}
.chip input{display:none}
.chip.on,.sb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.g1{grid-template-columns:minmax(0,1fr)}
@media(max-aspect-ratio:1/1){.g2{grid-template-columns:minmax(0,1fr)}.g3>:last-child,.g5>:last-child{grid-column:1/-1}}
@media(min-aspect-ratio:7/5){.g3,.g4{grid-template-columns:repeat(var(--n),minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-height:520px){h1{display:none}}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s}
.card:active{transform:scale(.98)}
.card svg{flex:1;min-height:0;width:100%;height:100%;display:block}
.word{font-size:clamp(1.1rem,5vmin,2rem);font-weight:900;line-height:1.1;margin-top:4px}
.sent{opacity:.7;font-size:clamp(.75rem,2.6vmin,1rem)}
.slide{flex:1;min-height:0;display:flex;align-items:stretch;gap:8px}
.slide .card{flex:1}
.slide .word{font-size:clamp(1.4rem,7vmin,3rem)}
.nav{align-self:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:2rem;cursor:pointer;flex:none}
.dots{text-align:center;margin-top:2px;font-size:1.1rem;letter-spacing:6px}
.dots span{opacity:.3;cursor:pointer}.dots .cur{opacity:1}
.q{text-align:center;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.q h2{margin:0;font-size:clamp(1rem,3.5vmin,1.4rem)}
.btn{padding:10px 18px;border-radius:14px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.q .btn{align-self:center;padding:6px 14px}
.opt.ok{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)}
.opt.no{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stars{font-size:2.2rem;margin:10px 0}
.msg{text-align:center;padding:20px;font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:.75rem}
.foot select{font:inherit;max-width:190px}
.foot .sb{padding:2px 10px;font-size:.8rem}
@keyframes pop{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.03)}}
.pop{transform-origin:100px 130px;animation:pop 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.tw{animation:tw 1.2s ease-in-out infinite alternate}
</style>
</head>
<body>
<main>
<h1>👕 Clothes Words 👗</h1>
<div class="panel"><b>👩‍🏫 Teacher: pick today’s words</b><div class="chips" id="chips"></div></div>
<div class="tabs"><button class="tab on" data-tab="learn">🖼️ Pictures</button><button class="tab" data-tab="quiz">🎮 Game</button></div>
<div id="view"></div>
<div class="foot"><label>🔊 Voice <select id="vs"></select></label><label>Speed <select id="sp"><option value=".65">Slow</option><option value=".8" selected>Normal</option><option value="1">Fast</option></select></label><button class="sb" id="vt">▶ Test</button></div>
</main>
<script>
var WORDS=[{k:"tshirt",l:"T-shirt",v:"T shirt",s:"I’m wearing a T-shirt."},{k:"shorts",l:"Shorts",v:"shorts",s:"I’m wearing shorts."},{k:"dress",l:"Dress",v:"dress",s:"I’m wearing a dress."},{k:"shoes",l:"Shoes",v:"shoes",s:"I’m wearing shoes."},{k:"hat",l:"Hat",v:"hat",s:"I’m wearing a hat."}];
var sel=new Set(WORDS.map(function(w){return w.k})),tab="learn",mode="all",si=0,Q=null;
function W(k){return WORDS.filter(function(w){return w.k==k})[0]}
function lgx(id,a,b){return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`}
function bg(k,a,b,c1,c2){return `<defs><linearGradient id="${k}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>${lgx(k+"i",c1,c2)}</defs><rect width="200" height="150" fill="url(#${k}s)"/><rect y="128" width="200" height="22" fill="#ffffff66"/><ellipse cx="100" cy="134" rx="62" ry="7" fill="#00000026"/>`}
function shoe(k,t){return `<g transform="${t}"><path d="M30 112Q30 100 40 98H100Q150 98 168 108Q172 118 160 120H40Q30 120 30 112Z" fill="#fff" stroke="#cfcfcf"/><path d="M36 98V64Q36 58 44 58H78Q84 76 104 84Q134 90 158 104Q160 108 150 108H36Z" fill="url(#${k}i)"/><path d="M80 66l12 4M86 74l12 4M92 80l12 4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M36 98H158" stroke="#00000030" stroke-width="2"/><path d="M138 97Q150 98 160 104" stroke="#fff" stroke-width="3" fill="none"/><path d="M40 70Q38 90 44 98" stroke="#ffffff66" stroke-width="3" fill="none"/></g>`}
function scene(k){var h='<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+W(k).l+'">';
if(k=="tshirt"){
h+=bg(k,"#ffd9d9","#fff5f0","#ff8585","#d33a3a")+`<g class="pop"><path d="M72 30Q100 50 128 30L160 48 146 76 126 66V124Q100 130 74 124V66L54 76 40 48Z" fill="url(#${k}i)"/><path d="M74 70Q80 100 76 122M126 70Q120 100 124 122M58 52L66 62" stroke="#00000018" stroke-width="5" fill="none"/><path d="M74 31Q100 50 126 31" fill="none" stroke="#a82a2a" stroke-width="5" stroke-linecap="round"/><polygon class="tw" points="100,78 104,88 114,88 106,94 109,104 100,98 91,104 94,94 86,88 96,88" fill="#ffd93b"/></g>`;
}else if(k=="shorts"){
h+=bg(k,"#d6e9ff","#f3f9ff","#5aaaff","#2a62c9")+`<g class="pop"><path d="M62 50H138L148 114H108L100 80 92 114H52Z" fill="url(#${k}i)"/><path d="M68 52L58 112M132 52L142 112" stroke="#ffffffaa" stroke-width="3"/><path d="M100 80L108 114M100 80L92 114" stroke="#00000020" stroke-width="3"/><rect x="62" y="38" width="76" height="14" rx="3" fill="#2457b3"/><path d="M96 52V68M104 52V68" stroke="#fff" stroke-width="2"/><circle cx="96" cy="69" r="2.5" fill="#fff"/><circle cx="104" cy="69" r="2.5" fill="#fff"/></g>`;
}else if(k=="dress"){
h+=bg(k,"#ffdcee","#fff3f9","#ff8fc2","#d83a85")+`<g class="pop"><path d="M84 24H92L100 40 108 24H116L120 56 112 64 150 124Q100 136 50 124L88 64 80 56Z" fill="url(#${k}i)"/><path d="M85 62Q100 70 115 62L113 70Q100 76 87 70Z" fill="#b01a63"/><path d="M96 76L84 124M108 76L120 126" stroke="#00000015" stroke-width="4" fill="none"/><g fill="#fff" opacity=".8"><circle cx="72" cy="112" r="3"/><circle cx="96" cy="118" r="3"/><circle cx="126" cy="112" r="3"/><circle cx="108" cy="100" r="3"/><circle cx="84" cy="100" r="3"/><circle cx="136" cy="120" r="3"/><circle cx="100" cy="88" r="3"/></g></g>`;
}else if(k=="shoes"){
h+=bg(k,"#dff4df","#f6fff3","#ff8a4c","#d9421c")+`<g class="pop">`+shoe(k,"translate(46 -8) scale(.7)")+shoe(k,"translate(-4 22) scale(.9)")+`</g>`;
}else{
h+=bg(k,"#fff0c9","#fffaf0","#f7de93","#d6a346")+`<g class="pop"><ellipse cx="100" cy="100" rx="76" ry="20" fill="url(#${k}i)"/><ellipse cx="100" cy="98" rx="46" ry="11" fill="#00000018"/><path d="M60 98Q58 40 100 40Q142 40 140 98Q100 112 60 98Z" fill="url(#${k}i)"/><path d="M70 60Q100 52 130 60M66 72Q100 64 134 72M20 104Q100 124 180 104" stroke="#ffffff66" stroke-width="2" fill="none"/><path d="M60.5 86Q100 100 139.5 86L140 98Q100 112 60 98Z" fill="#e5484d"/><circle cx="122" cy="96" r="6" fill="#ffd93b"/><circle cx="122" cy="96" r="2.5" fill="#e5484d"/></g>`}
return h+'</svg>'}

var voice=null,male=false,rate=.8,vlist=[];
function pick(){var all=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(function(x){return /^en/i.test(x.lang)});var v=all.filter(function(x){return /^en[-_]US/i.test(x.lang)});if(!v.length)v=all;
var f=function(r){return v.filter(function(x){return r.test(x.name)})[0]};
var sc=function(x){var n=x.name,s=0;if(/natural|neural/i.test(n))s+=100;if(/premium|enhanced|siri/i.test(n))s+=60;if(/google/i.test(n))s+=40;if(/^en[-_]US/i.test(x.lang))s+=30;if(/\b(male|guy|christopher|eric|andrew|brian|roger|ryan|david|alex|aaron|evan|mark|tom|fred|matthew|steven)\b/i.test(n))s+=20;if(/espeak|compact/i.test(n))s-=80;return s};var m=v.slice().sort(function(a,b){return sc(b)-sc(a)})[0];male=true;
if(!m)m=f(/Google US English/i);
if(!m)m=v[0];
voice=m||null;var sv="";try{sv=localStorage.getItem("vn")||""}catch(e){}var sm=all.filter(function(x){return x.name==sv})[0];if(sm){voice=sm;male=true}
vlist=all;var s=document.getElementById("vs");s.innerHTML=all.length?all.map(function(x){return '<option '+(voice&&x.name==voice.name?"selected":"")+' value="'+x.name+'">'+x.name+' ('+x.lang+')</option>'}).join(""):"<option>No English voice</option>"}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.pitch=1;speechSynthesis.speak(u)}

function words(){return WORDS.filter(function(w){return sel.has(w.k)})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function chips(){document.getElementById("chips").innerHTML=WORDS.map(function(w){return `<label class="chip ${sel.has(w.k)?"on":""}"><input type="checkbox" data-k="${w.k}" ${sel.has(w.k)?"checked":""}>${w.l}</label>`}).join("")}
function cardHtml(w){return `<button class="card" data-say="${w.k}">${scene(w.k)}<div class="word">${w.l} 🔊</div><div class="sent">${w.s}</div></button>`}
function say1(w){say(w.v+". "+w.s)}
function learn(){var ws=words(),v=document.getElementById("view");
if(!ws.length){v.innerHTML='<div class="msg">Pick at least 1 word above 👆</div>';return}
if(si>=ws.length)si=0;
var seg=`<div class="seg"><button class="sb ${mode=="all"?"on":""}" data-mode="all">Show all</button><button class="sb ${mode=="slide"?"on":""}" data-mode="slide">Slideshow</button></div>`;
if(mode=="all"){v.innerHTML=seg+`<div class="grid g${ws.length}" style="--n:${ws.length}">`+ws.map(cardHtml).join("")+'</div>';return}
v.innerHTML=seg+`<div class="slide"><button class="nav" data-act="prev" aria-label="Previous">‹</button>${cardHtml(ws[si])}<button class="nav" data-act="next" aria-label="Next">›</button></div><div class="dots">${ws.map(function(w,i){return `<span class="${i==si?"cur":""}" data-dot="${i}">●</span>`}).join("")}</div>`}
function go(d){var ws=words();if(!ws.length)return;si=(si+d+ws.length)%ws.length;learn();say1(ws[si])}
function quiz(){var ws=words(),v=document.getElementById("view");
if(ws.length<2){v.innerHTML='<div class="msg">Pick at least 2 words to play 👆</div>';return}
var o=[];while(o.length<6)o=o.concat(shuffle(ws.map(function(w){return w.k})));
Q={qs:o.slice(0,6),i:0,score:0,tried:false};ask()}
function ask(){var v=document.getElementById("view");
if(Q.i>=Q.qs.length){var s="";for(var n=0;n<Q.qs.length;n++)s+=n<Q.score?"⭐":"☆";
v.innerHTML=`<div class="q"><h2>Well done! 🎉</h2><div class="stars">${s}</div><button class="btn" data-act="again">Play again 🔁</button></div>`;say("Well done!");return}
var t=W(Q.qs[Q.i]);Q.tried=false;var n=words().length;
v.innerHTML=`<div class="q"><h2>Question ${Q.i+1}/${Q.qs.length} – Show me the “${t.l}”!</h2><button class="btn" data-act="hear">🔊 Hear again</button><div class="grid g${n}" style="--n:${n}">`+shuffle(words()).map(function(w){return `<button class="card opt" data-pick="${w.k}">${scene(w.k)}</button>`}).join("")+'</div></div>';
say("Show me the "+t.v+"!")}
function render(){chips();document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab==tab)});tab=="learn"?learn():quiz()}

document.addEventListener("click",function(e){
var t=e.target.closest("[data-tab],[data-mode],[data-dot],[data-say],[data-pick],[data-act]");if(!t)return;
var d=t.dataset;
if(d.tab){tab=d.tab;render()}
else if(d.mode){mode=d.mode;learn()}
else if(d.dot){si=+d.dot;learn();say(words()[si].v)}
else if(d.say)say1(W(d.say));
else if(d.act=="prev")go(-1);
else if(d.act=="next")go(1);
else if(d.act=="hear")say("Show me the "+W(Q.qs[Q.i]).v+"!");
else if(d.act=="again")quiz();
else if(d.pick){if(t.classList.contains("ok"))return;
if(d.pick==Q.qs[Q.i]){t.classList.add("ok");if(!Q.tried)Q.score++;say("Great job! "+W(d.pick).v+"!");Q.i++;setTimeout(ask,1700)}
else{Q.tried=true;t.classList.add("no");say("Oops! Try again!");setTimeout(function(){t.classList.remove("no")},450)}}});
document.addEventListener("change",function(e){var k=e.target.dataset&&e.target.dataset.k;if(!k)return;e.target.checked?sel.add(k):sel.delete(k);render()});
document.addEventListener("keydown",function(e){if(tab=="learn"&&mode=="slide"){if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)}});
document.getElementById("vs").onchange=function(){var n=this.value;voice=vlist.filter(function(x){return x.name==n})[0]||voice;male=true;try{localStorage.setItem("vn",n)}catch(e){}say("Show me the dress!")};
document.getElementById("sp").onchange=function(){rate=+this.value;say("Show me the dress!")};
document.getElementById("vt").onclick=function(){say("Hello! I’m wearing a hat.")};
render();
</script>
</body>
</html>
