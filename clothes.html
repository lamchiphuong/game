<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dress Up Fun - English For Kids</title>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/7417/7417603.png">
<link rel="shortcut icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/7417/7417603.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7417/7417603.png">

<meta name="description" content="Dress Up Fun - Trò chơi mặc quần áo vui nhộn giúp bé học tiếng Anh!">

<meta property="og:type" content="website">
<meta property="og:title" content="Dress Up Fun - English For Kids">
<meta property="og:description" content="Trò chơi mặc quần áo vui nhộn giúp bé học tiếng Anh!">
<meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/7417/7417603.png">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Dress Up Fun - English For Kids">
<meta name="twitter:description" content="Trò chơi mặc quần áo vui nhộn giúp bé học tiếng Anh!">
<meta name="twitter:image" content="https://cdn-icons-png.flaticon.com/512/7417/7417603.png">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fed6e3 100%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* Màn hình mở đầu */
  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  .start-card {
    background: #ffffff;
    padding: 28px 36px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    border: 5px solid #4ecdc4;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 90%;
  }
  .start-card h1 {
    color: #ff4757;
    margin: 0 0 20px 0;
    font-size: 28px;
  }
  .start-btn {
    background: linear-gradient(135deg, #ff6b6b, #ff4757);
    color: white;
    border: none;
    font-size: 24px;
    font-weight: 900;
    padding: 14px 34px;
    border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 auto;
  }
  .start-btn:active {
    transform: scale(0.92);
  }

  /* Header */
  header {
    width: 100%;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .score-board {
    font-size: 20px;
    background: #ffffff;
    padding: 6px 16px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: #ff4757;
    font-weight: 800;
  }
  .header-hint {
    font-size: 15px;
    color: #444;
    font-weight: bold;
  }

  /* Sân chơi chính - Mặc định Desktop (hàng ngang) */
  .game-stage {
    display: flex;
    width: 95%;
    max-width: 1100px;
    flex: 1;
    justify-content: space-around;
    align-items: center;
    position: relative;
    padding-bottom: 10px;
  }

  /* Khu vực nhân vật & bóng thoại */
  .character-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .speech-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    position: relative;
  }
  .speech-bubble {
    background: #ffffff;
    border: 3px solid #48dbfb;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 18px;
    color: #222;
    position: relative;
    font-weight: 800;
    box-shadow: 0 6px 15px rgba(72, 219, 251, 0.35);
    animation: bounce 2s infinite ease-in-out;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 30px;
    border-width: 10px 10px 0;
    border-style: solid;
    border-color: #48dbfb transparent;
    display: block;
    width: 0;
  }
  .speaker-inline-btn {
    background: #fffa65;
    border: 3px solid #ff9f43;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 159, 67, 0.4);
    animation: pulse 1.6s infinite;
  }
  .speaker-inline-btn:active {
    transform: scale(0.88);
  }

  .character-canvas-wrap {
    width: 230px;
    height: 330px;
    background: #ffffff;
    border-radius: 24px;
    padding: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #fff;
    cursor: pointer;
  }
  #charCanvas {
    width: 100%;
    height: 100%;
  }

  /* Tủ quần áo */
  .wardrobe-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wardrobe-hint {
    position: absolute;
    top: -46px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 20;
    pointer-events: none;
    animation: bouncePointer 1s infinite alternate ease-in-out;
  }
  .hint-bubble {
    background: #ff4757;
    color: #ffffff;
    font-size: 14px;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 16px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  .hint-arrow {
    font-size: 24px;
    line-height: 1;
    color: #ff4757;
  }

  .wardrobe {
    width: 360px;
    height: 380px;
    background: #8d5b36;
    border: 8px solid #5a351a;
    border-radius: 20px;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    perspective: 1200px;
    cursor: pointer;
  }
  .wardrobe-interior {
    width: 100%;
    height: 100%;
    background: #fdf5ea;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 10px;
  }

  .door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #a66f44, #804e28);
    border: 3px solid #4a2810;
    z-index: 5;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .door-left {
    left: 0;
    transform-origin: left;
    border-radius: 12px 0 0 12px;
    justify-content: flex-end;
    padding-right: 8px;
  }
  .door-right {
    right: 0;
    transform-origin: right;
    border-radius: 0 12px 12px 0;
    justify-content: flex-start;
    padding-left: 8px;
  }
  .door-handle {
    width: 12px;
    height: 44px;
    background: #ffd700;
    border-radius: 6px;
    box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
  }

  .wardrobe.open .door-left {
    transform: rotateY(-130deg);
  }
  .wardrobe.open .door-right {
    transform: rotateY(130deg);
  }
  .wardrobe.open .door {
    pointer-events: auto;
  }

  .item-card {
    background: #ffffff;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    cursor: pointer;
    border: 2px solid #ffeedb;
    padding: 6px;
  }
  .item-card:active {
    transform: scale(0.96);
  }
  .item-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border-radius: 8px;
    pointer-events: none;
  }
  .item-label {
    font-size: 14px;
    font-weight: 800;
    color: #444;
    margin-top: 4px;
  }

  /* ================= RESPONSIVE CHO ĐIỆN THOẠI DI ĐỘNG (DỌC) ================= */
  @media (max-width: 768px) {
    .game-stage {
      flex-direction: column;
      justify-content: flex-start;
      gap: 10px;
      padding-bottom: 6px;
    }
    .header-hint {
      display: none;
    }
    .speech-bubble {
      font-size: 16px;
      padding: 6px 14px;
    }
    .speaker-inline-btn {
      width: 38px;
      height: 38px;
      font-size: 18px;
    }
    .character-canvas-wrap {
      width: 140px;
      height: 195px;
      border-radius: 18px;
      padding: 4px;
    }
    .wardrobe {
      width: min(92vw, 340px);
      height: min(44vh, 290px);
      border-width: 6px;
    }
    .wardrobe-hint {
      top: -38px;
    }
    .hint-bubble {
      font-size: 12px;
      padding: 3px 10px;
    }
    .hint-arrow {
      font-size: 18px;
    }
    .item-img {
      width: 52px;
      height: 52px;
    }
    .item-label {
      font-size: 12px;
      margin-top: 2px;
    }
    .door-handle {
      height: 36px;
      width: 10px;
    }
  }

  /* Hiệu ứng chuyển động */
  .shake { animation: shake 0.5s ease-in-out; }
  .cheer { animation: cheer 0.6s ease-in-out infinite alternate; }

  .star-fx {
    position: absolute;
    font-size: 30px;
    animation: starFly 1s forwards ease-out;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes bouncePointer {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }
  @keyframes starFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-12px); }
    40%, 80% { transform: translateX(12px); }
  }
  @keyframes cheer {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-12px) scale(1.04); }
  }
</style>
</head>
<body>

<!-- Màn hình mở đầu mở khoá âm thanh -->
<div id="startScreen">
  <div class="start-card">
    <h1>👗 Dress Up Game 👕</h1>
    <button class="start-btn" onclick="startGame()">
      <span>Play Game</span> <span>▶</span>
    </button>
  </div>
</div>

<header>
  <div class="score-board">⭐ Stars: <span id="scoreText">0</span></div>
  <div class="header-hint">Tap speaker 🔊 to listen!</div>
</header>

<div class="game-stage">
  <!-- Nhân vật Canvas -->
  <div class="character-area" id="charArea">
    <div class="speech-container">
      <div class="speech-bubble" id="bubbleText">
        <span id="requestPrompt">Loading...</span>
      </div>
      <button class="speaker-inline-btn" onclick="speakCurrentRequest()" title="Nghe lại câu nói">🔊</button>
    </div>

    <div class="character-canvas-wrap" id="charWrap" onclick="speakCurrentRequest()">
      <canvas id="charCanvas" width="250" height="360"></canvas>
    </div>
  </div>

  <!-- Tủ quần áo -->
  <div class="wardrobe-container">
    <div class="wardrobe-hint" id="wardrobeHint">
      <div class="hint-bubble">Tap to open! 👇</div>
      <div class="hint-arrow">⬇️</div>
    </div>

    <div class="wardrobe" id="wardrobeBox">
      <div class="door door-left" onclick="handleDoorClick(event)"><div class="door-handle"></div></div>
      <div class="door door-right" onclick="handleDoorClick(event)"><div class="door-handle"></div></div>

      <div class="wardrobe-interior">
        <div class="item-card" draggable="true" ondragstart="drag(event)" onclick="chooseItem('T-shirt', event)" data-item="T-shirt">
          <img class="item-img" src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=350&q=80" alt="T-shirt">
          <div class="item-label">T-shirt</div>
        </div>

        <div class="item-card" draggable="true" ondragstart="drag(event)" onclick="chooseItem('trousers', event)" data-item="trousers">
          <img class="item-img" src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=350&q=80" alt="Trousers">
          <div class="item-label">Trousers</div>
        </div>

        <div class="item-card" draggable="true" ondragstart="drag(event)" onclick="chooseItem('shoes', event)" data-item="shoes">
          <img class="item-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=350&q=80" alt="Shoes">
          <div class="item-label">Shoes</div>
        </div>

        <div class="item-card" draggable="true" ondragstart="drag(event)" onclick="chooseItem('dress', event)" data-item="dress">
          <img class="item-img" src="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=350&q=80" alt="Dress">
          <div class="item-label">Dress</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ================= 1. VẼ NHÂN VẬT CANVAS ANIMATION ================= */
  const canvas = document.getElementById('charCanvas');
  const ctx = canvas.getContext('2d');

  let currentCharacter = 'boy';
  let charEmotion = 'idle';
  let wornItem = null;
  let animTick = 0;
  let isBlinking = false;

  function renderCharacter() {
    animTick++;
    isBlinking = (animTick % 160 > 152);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const breatheOffset = Math.sin(animTick * 0.05) * 3;

    if (currentCharacter === 'boy') {
      drawBoy(breatheOffset);
    } else {
      drawGirl(breatheOffset);
    }

    requestAnimationFrame(renderCharacter);
  }

  function drawBoy(dy) {
    const cx = 125;
    const cy = 110 + dy;

    ctx.fillStyle = wornItem === 'trousers' ? '#2b8a3e' : '#1971c2';
    ctx.fillRect(95, 230, 24, 75);
    ctx.fillRect(131, 230, 24, 75);

    ctx.fillStyle = wornItem === 'shoes' ? '#d9480f' : '#343a40';
    ctx.beginPath();
    ctx.ellipse(107, 305, 17, 9, 0, 0, Math.PI * 2);
    ctx.ellipse(143, 305, 17, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = wornItem === 'T-shirt' ? '#f59f00' : '#4dabf7';
    ctx.beginPath();
    ctx.roundRect(80, 160 + dy * 0.5, 90, 75, 12);
    ctx.fill();

    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(75, 215 + dy * 0.5, 10, 0, Math.PI * 2);
    ctx.arc(175, 215 + dy * 0.5, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffdfba';
    ctx.fillRect(115, 148 + dy, 20, 15);

    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(cx, cy, 46, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5c3d2e';
    ctx.beginPath();
    ctx.arc(cx, cy - 6, 48, Math.PI * 0.85, Math.PI * 2.15);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 42, cy - 10);
    ctx.quadraticCurveTo(cx - 20, cy - 5, cx - 10, cy - 20);
    ctx.quadraticCurveTo(cx + 10, cy - 5, cx + 25, cy - 18);
    ctx.quadraticCurveTo(cx + 40, cy - 8, cx + 44, cy);
    ctx.lineTo(cx + 44, cy - 40);
    ctx.lineTo(cx - 42, cy - 40);
    ctx.fill();

    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(cx - 46, cy, 9, 0, Math.PI * 2);
    ctx.arc(cx + 46, cy, 9, 0, Math.PI * 2);
    ctx.fill();

    drawFaceFeatures(cx, cy);
  }

  function drawGirl(dy) {
    const cx = 125;
    const cy = 110 + dy;

    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.arc(cx - 52, cy - 25, 20, 0, Math.PI * 2);
    ctx.arc(cx + 52, cy - 25, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff4081';
    ctx.beginPath();
    ctx.arc(cx - 42, cy - 18, 6, 0, Math.PI * 2);
    ctx.arc(cx + 42, cy - 18, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffdfba';
    ctx.fillRect(100, 235, 18, 70);
    ctx.fillRect(132, 235, 18, 70);

    ctx.fillStyle = wornItem === 'shoes' ? '#d9480f' : '#e64980';
    ctx.beginPath();
    ctx.ellipse(109, 305, 16, 9, 0, 0, Math.PI * 2);
    ctx.ellipse(141, 305, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    if (wornItem === 'dress' || (!wornItem && targetItem !== 'trousers')) {
      ctx.fillStyle = wornItem === 'dress' ? '#e03131' : '#f783ac';
      ctx.beginPath();
      ctx.moveTo(90, 160 + dy * 0.5);
      ctx.lineTo(160, 160 + dy * 0.5);
      ctx.lineTo(185, 245 + dy * 0.5);
      ctx.lineTo(65, 245 + dy * 0.5);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = wornItem === 'T-shirt' ? '#f59f00' : '#ff922b';
      ctx.beginPath();
      ctx.roundRect(85, 160 + dy * 0.5, 80, 70, 12);
      ctx.fill();
      if (wornItem === 'trousers') {
        ctx.fillStyle = '#2b8a3e';
        ctx.fillRect(96, 225, 24, 75);
        ctx.fillRect(130, 225, 24, 75);
      }
    }

    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(75, 215 + dy * 0.5, 9, 0, Math.PI * 2);
    ctx.arc(175, 215 + dy * 0.5, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffdfba';
    ctx.fillRect(115, 148 + dy, 20, 15);

    ctx.fillStyle = '#ffdfba';
    ctx.beginPath();
    ctx.arc(cx, cy, 45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.arc(cx, cy - 6, 47, Math.PI * 0.9, Math.PI * 2.1);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy - 14, 38, 0, Math.PI);
    ctx.fill();

    drawFaceFeatures(cx, cy);
  }

  function drawFaceFeatures(cx, cy) {
    ctx.fillStyle = 'rgba(255, 107, 129, 0.45)';
    ctx.beginPath();
    ctx.arc(cx - 24, cy + 12, 9, 0, Math.PI * 2);
    ctx.arc(cx + 24, cy + 12, 9, 0, Math.PI * 2);
    ctx.fill();

    if (isBlinking) {
      ctx.strokeStyle = '#2d3436';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(cx - 16, cy + 2, 7, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + 16, cy + 2, 7, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#2d3436';
      ctx.beginPath();
      ctx.arc(cx - 16, cy + 2, 6.5, 0, Math.PI * 2);
      ctx.arc(cx + 16, cy + 2, 6.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx - 18, cy, 2.5, 0, Math.PI * 2);
      ctx.arc(cx + 14, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#d63031';
    ctx.beginPath();
    if (charEmotion === 'happy') {
      ctx.fillStyle = '#ff7675';
      ctx.arc(cx, cy + 18, 11, 0, Math.PI);
      ctx.fill();
      ctx.stroke();
    } else if (charEmotion === 'sad') {
      ctx.arc(cx, cy + 28, 9, Math.PI * 1.2, Math.PI * 1.8);
      ctx.stroke();
    } else {
      ctx.arc(cx, cy + 16, 9, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }

  /* ================= 2. GIỌNG ĐỌC GOOGLE AI ================= */
  let googleVoice = null;
  function loadGoogleVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    googleVoice = voices.find(v => v.name.includes('Google US English')) ||
                  voices.find(v => v.name.includes('Google UK English Female')) ||
                  voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) ||
                  voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadGoogleVoices;
    loadGoogleVoices();
  }

  function playGoogleSpeech(text, onEndCallback = null) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if (!googleVoice) loadGoogleVoices();
      if (googleVoice) utter.voice = googleVoice;
      utter.lang = 'en-US';
      utter.rate = 0.85;
      utter.pitch = 1.25;

      let hasFinished = false;
      const finish = () => {
        if (!hasFinished) {
          hasFinished = true;
          if (onEndCallback) onEndCallback();
        }
      };

      utter.onend = finish;
      utter.onerror = finish;
      window.speechSynthesis.speak(utter);
    } else {
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(text)}`;
      const audio = new Audio(url);
      if (onEndCallback) audio.onended = onEndCallback;
      audio.play().catch(() => {
        if (onEndCallback) onEndCallback();
      });
    }
  }

  /* ================= 3. ÂM THANH HIỆU ỨNG SFX ================= */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type='sine') {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function sfxDoor() { playTone(180, 0.25, 'triangle'); }
  function sfxSuccess() {
    playTone(523.25, 0.12);
    setTimeout(() => playTone(659.25, 0.12), 130);
    setTimeout(() => playTone(783.99, 0.3), 260);
  }
  function sfxWrong() {
    playTone(200, 0.2, 'sawtooth');
    setTimeout(() => playTone(160, 0.25, 'sawtooth'), 180);
  }

  /* ================= 4. LOGIC GAME ================= */
  let currentScore = 0;
  let isWardrobeOpen = false;
  let targetItem = 'T-shirt';
  let isAnimating = false;

  const charArea = document.getElementById('charArea');
  const wardrobeBox = document.getElementById('wardrobeBox');
  const wardrobeHint = document.getElementById('wardrobeHint');
  const requestPrompt = document.getElementById('requestPrompt');
  const charWrap = document.getElementById('charWrap');
  const scoreText = document.getElementById('scoreText');
  const startScreen = document.getElementById('startScreen');

  charArea.addEventListener('dragover', (e) => e.preventDefault());
  charArea.addEventListener('drop', (e) => {
    e.preventDefault();
    const item = e.dataTransfer.getData('text/plain');
    chooseItem(item);
  });

  function startGame() {
    initAudio();
    startScreen.style.display = 'none';
    renderCharacter();
    nextTurn();
  }

  function handleDoorClick(e) {
    e.stopPropagation();
    toggleWardrobe();
  }

  function toggleWardrobe(forceOpen = null) {
    if (forceOpen !== null) {
      isWardrobeOpen = forceOpen;
    } else {
      isWardrobeOpen = !isWardrobeOpen;
    }

    if (wardrobeHint) {
      wardrobeHint.style.display = 'none';
    }

    sfxDoor();
    wardrobeBox.classList.toggle('open', isWardrobeOpen);
  }

  function nextTurn() {
    isAnimating = false;
    charEmotion = 'idle';
    wornItem = null;
    currentCharacter = Math.random() < 0.5 ? 'boy' : 'girl';

    const boyItems = ['T-shirt', 'trousers', 'shoes'];
    const girlItems = ['T-shirt', 'trousers', 'shoes', 'dress'];
    const pool = currentCharacter === 'boy' ? boyItems : girlItems;

    targetItem = pool[Math.floor(Math.random() * pool.length)];

    const promptText = `Take me the ${targetItem}!`;
    requestPrompt.textContent = `"${promptText}"`;
    playGoogleSpeech(promptText);
  }

  function speakCurrentRequest() {
    if (isAnimating) return;
    playGoogleSpeech(`Take me the ${targetItem}!`);
  }

  function drag(ev) {
    ev.dataTransfer.setData('text/plain', ev.target.dataset.item);
  }

  function chooseItem(item, e = null) {
    if (e) e.stopPropagation();
    if (isAnimating) return;

    if (!isWardrobeOpen) {
      toggleWardrobe(true);
    }

    if (item.toLowerCase() === targetItem.toLowerCase()) {
      isAnimating = true;
      currentScore++;
      scoreText.textContent = currentScore;
      sfxSuccess();
      charEmotion = 'happy';
      wornItem = item;
      charWrap.classList.add('cheer');
      spawnStars();

      const successMsg = `Good job! Thank you for the ${targetItem}!`;
      playGoogleSpeech(successMsg, () => {
        setTimeout(() => {
          charWrap.classList.remove('cheer');
          nextTurn();
        }, 600);
      });
    } else {
      sfxWrong();
      charEmotion = 'sad';
      charWrap.classList.add('shake');

      const failMsg = (currentCharacter === 'boy' && item.toLowerCase() === 'dress')
        ? `No, boys do not wear a dress! Please take me the ${targetItem}`
        : `No, that is not the ${targetItem}. Please take me the ${targetItem}!`;

      playGoogleSpeech(failMsg, () => {
        charWrap.classList.remove('shake');
        charEmotion = 'idle';
      });
    }
  }

  function spawnStars() {
    const rect = charArea.getBoundingClientRect();
    const icons = ['⭐', '🌟', '✨', '💖', '🎉'];
    for (let i = 0; i < 12; i++) {
      const star = document.createElement('div');
      star.className = 'star-fx';
      star.textContent = icons[Math.floor(Math.random() * icons.length)];
      star.style.left = (rect.left + rect.width / 2) + 'px';
      star.style.top = (rect.top + rect.height / 3) + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 50 + Math.random() * 80;
      star.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
      star.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 1000);
    }
  }
</script>
</body>
