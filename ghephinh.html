<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghép hình bạn thú</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#dff3f0;--card:#fff;--ink:#23424a;--accent:#f59f3a;--slot:#b9dcd6;--ok:#3fae6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17302f;--card:#244846;--ink:#e8f6f3;--slot:#35615e}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 14px 28px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:2rem;font-weight:800;margin:4px 0 8px;letter-spacing:.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.thumb{width:62px;height:62px;border-radius:50%;border:4px solid transparent;background:var(--card) center/cover;cursor:pointer;padding:0}
.thumb[aria-pressed=true]{border-color:var(--accent);transform:scale(1.1)}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 16px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn[aria-pressed=true]{background:var(--accent);color:#3b2400}
.btn:focus-visible,.thumb:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#status{font-weight:700;margin:6px 0}
#board{position:relative;display:grid;border-radius:14px;background:var(--card);box-shadow:0 0 0 6px var(--card),0 6px 0 6px rgba(0,0,0,.15);margin:10px 0 16px;overflow:hidden}
#board .ghost{position:absolute;inset:0;background-size:100% 100%;opacity:0;transition:opacity .2s;pointer-events:none}
#board.hint .ghost{opacity:.22}
.cell{border:2px dashed var(--slot);position:relative}
.piece{position:relative;background-repeat:no-repeat;border-radius:8px;cursor:grab;touch-action:none;box-shadow:0 3px 6px rgba(0,0,0,.3);flex:none}
.cell .piece{position:absolute;inset:-2px;width:calc(100% + 4px)!important;height:calc(100% + 4px)!important;border-radius:0;box-shadow:none;cursor:default;animation:pop .3s}
.piece.drag{position:fixed;z-index:50;cursor:grabbing;box-shadow:0 10px 18px rgba(0,0,0,.35);transform:scale(1.06)}
.piece.back{animation:shake .35s}
#tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px;min-height:80px;padding:10px;border-radius:16px;background:rgba(255,255,255,.35)}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#win{position:fixed;inset:0;background:rgba(20,40,45,.6);display:none;align-items:center;justify-content:center;z-index:100}
#win.show{display:flex}
#win div{background:var(--card);border-radius:24px;padding:22px 30px;text-align:center;animation:pop .5s}
#win b{display:block;font-size:2.2rem;font-weight:800;color:var(--ok)}
#win .full{width:150px;height:150px;margin:8px auto 12px;background-size:cover;background-position:center;border-radius:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<h1>Ghép hình bạn thú</h1>
<div class="row" id="chars" role="group" aria-label="Chọn nhân vật"></div>
<div class="row" id="levels" role="group" aria-label="Độ khó">
<button class="btn" data-n="2">Dễ 2×2</button><button class="btn" data-n="3">Vừa 3×3</button><button class="btn" data-n="4">Khó 4×4</button></div>
<div class="row"><button class="btn" id="hint" aria-pressed="false">Xem gợi ý</button><button class="btn" id="shuffle">Chơi lại</button></div>
<div id="status"></div>
<div id="board"></div>
<div id="tray"></div>
<div id="win"><div><b>Giỏi quá!</b><span id="wname"></span><div class="full" id="wimg"></div><button class="btn" id="next">Chơi hình tiếp theo</button></div></div>

let ci=0,n=3,placed=0,ar=1,W=300,H=300;
const $=s=>document.querySelector(s),board=$("#board"),tray=$("#tray");
const charsEl=$("#chars");
CHARS.forEach((c,i)=>{const b=document.createElement("button");b.className="thumb";b.style.backgroundImage=`url(${c.src})`;b.setAttribute("aria-label",c.name);b.onclick=()=>{ci=i;start()};charsEl.append(b)});
document.querySelectorAll("#levels .btn").forEach(b=>b.onclick=()=>{n=+b.dataset.n;start()});
$("#hint").onclick=e=>{const on=board.classList.toggle("hint");e.target.setAttribute("aria-pressed",on)};
$("#shuffle").onclick=start;
$("#next").onclick=()=>{ci=(ci+1)%CHARS.length;start()};
function start(){
  const c=CHARS[ci],img=new Image();
  img.onload=()=>{
    ar=img.height/img.width;
    W=Math.min(340,innerWidth-40);H=Math.round(W*ar);
    if(H>innerHeight*.5){H=Math.round(innerHeight*.5);W=Math.round(H/ar)}
    build(c)};
  img.src=c.src;
}
function build(c){
  $("#win").classList.remove("show");placed=0;
  document.querySelectorAll(".thumb").forEach((t,i)=>t.setAttribute("aria-pressed",i===ci));
  document.querySelectorAll("#levels .btn").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===n));
  const cw=W/n,ch=H/n;
  board.innerHTML=`<div class="ghost" style="background-image:url(${c.src})"></div>`;
  board.style.cssText=`width:${W}px;height:${H}px;grid-template:repeat(${n},1fr)/repeat(${n},1fr)`;
  tray.innerHTML="";
  const ps=[];
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
    const cell=document.createElement("div");cell.className="cell";board.append(cell);
    const p=document.createElement("div");p.className="piece";p.dataset.r=r;p.dataset.c=k;
    p.style.cssText=`width:${cw}px;height:${ch}px;background-image:url(${c.src});background-size:${W}px ${H}px;background-position:${-k*cw}px ${-r*ch}px`;
    p.addEventListener("pointerdown",down);ps.push(p)}
  ps.sort(()=>Math.random()-.5).forEach(p=>tray.append(p));
  status();
}
function status(){$("#status").textContent=`Đã ghép ${placed}/${n*n} mảnh`}
let cur=null,dx=0,dy=0;
function down(e){
  const p=e.currentTarget;if(p.parentElement!==tray)return;
  const r=p.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
  p.style.left=r.left+"px";p.style.top=r.top+"px";
  const ph=document.createElement("div");ph.style.cssText=`width:${r.width}px;height:${r.height}px`;ph.id="ph";
  tray.insertBefore(ph,p);document.body.append(p);p.classList.add("drag");
  p.setPointerCapture(e.pointerId);cur=p;
  p.onpointermove=m=>{p.style.left=m.clientX-dx+"px";p.style.top=m.clientY-dy+"px"};
  p.onpointerup=up;p.onpointercancel=up;
}
function up(e){
  const p=cur;cur=null;p.onpointermove=p.onpointerup=p.onpointercancel=null;
  const b=board.getBoundingClientRect(),r=p.getBoundingClientRect();
  const x=r.left+r.width/2-b.left,y=r.top+r.height/2-b.top;
  const col=Math.floor(x/(b.width/n)),row=Math.floor(y/(b.height/n));
  p.classList.remove("drag");p.style.left=p.style.top="";
  const ph=$("#ph");
  if(x>=0&&y>=0&&col<n&&row<n&&col==p.dataset.c&&row==p.dataset.r){
    board.children[1+row*n+col].append(p);ph.remove();placed++;status();
    if(placed===n*n)setTimeout(()=>{$("#wname").textContent="Bạn đã ghép xong hình "+CHARS[ci].name;$("#wimg").style.backgroundImage=`url(${CHARS[ci].src})`;$("#win").classList.add("show")},500);
  }else{ph.replaceWith(p);p.classList.add("back");setTimeout(()=>p.classList.remove("back"),400)}
}
addEventListener("resize",()=>{if(!placed)start()});
start();
</script></body></html>
