<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dress Up! – Put on your…</title>
<style>
:root{--ink:#3b2f63;--bg1:#bfe9ff;--bg2:#fff4c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow:hidden;user-select:none;-webkit-user-select:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}
.screen{position:absolute;inset:0}

/* ---------- Start screen ---------- */
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px;text-align:center}
#start h1{margin:0;font-size:clamp(30px,6vw,64px);color:#e11d48;text-shadow:0 4px 0 #fff}
#start p{margin:0;font-size:clamp(16px,2.6vw,26px);font-weight:700}
.pick{display:flex;gap:clamp(12px,4vw,48px);flex-wrap:wrap;justify-content:center;max-height:62vh}
.card{background:#fff;border-radius:28px;padding:12px 16px 14px;box-shadow:0 8px 0 rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s;height:min(52vh,420px)}
.card:active{transform:scale(.96)}
.card:hover{transform:translateY(-4px)}
.card svg{height:100%;width:auto;min-height:0}
.card span{font-size:clamp(18px,3vw,30px);font-weight:800}
#gear{position:absolute;right:14px;top:14px;width:52px;height:52px;border-radius:50%;background:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#settings{position:absolute;right:14px;top:74px;background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  text-align:left;font-size:16px;font-weight:700;z-index:5;max-width:min(320px,90vw)}
#settings label{display:flex;gap:8px;align-items:center;margin:6px 0}
#settings small{display:block;font-weight:400;opacity:.75;margin:6px 0 2px}
#settings input[type=file]{font-size:13px;max-width:100%}

/* ---------- Game ---------- */
#game{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:70px}
.ib{width:52px;height:52px;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
#promptBox{flex:1;text-align:center;font-weight:800;font-size:clamp(22px,4.6vw,46px);line-height:1.2}
#word{display:inline-block;background:#fff;color:#e11d48;border-radius:18px;padding:0 18px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
#word.bounce{animation:bounce .6s}
@keyframes bounce{0%{transform:scale(.6)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
#progress{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;opacity:.7;border:3px solid #fff}
.dot.cur{background:#fde047;opacity:1;transform:scale(1.25)}
.dot.done{background:#22c55e;opacity:1}
main{flex:1;display:flex;gap:12px;padding:0 12px 12px;min-height:0}
#stage{flex:1;min-width:0;border-radius:32px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#e0f4ff 0 72%,#f7d9a8 72% 100%);box-shadow:inset 0 0 0 6px #fff}
#stage.over{box-shadow:inset 0 0 0 8px #22c55e}
#stage.flash{animation:flash .45s}
@keyframes flash{0%,100%{box-shadow:inset 0 0 0 6px #fff}30%{box-shadow:inset 0 0 0 10px #ef4444}}
#charSvg{width:100%;height:100%;display:block;transform-origin:50% 100%}
#charSvg.dance{animation:dance .7s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-3deg) translateY(0)}to{transform:rotate(3deg) translateY(-14px)}}
.cloth.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}

#closet{width:clamp(220px,34%,380px);background:linear-gradient(90deg,#b9783a,#d89a57 50%,#b9783a);border-radius:26px;padding:12px;
  box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 0 0 5px #8a5527;display:flex;flex-direction:column;gap:8px;min-height:0}
#closet h2{margin:0;text-align:center;color:#fff;font-size:clamp(18px,2.4vw,26px);text-shadow:0 2px 0 rgba(0,0,0,.3)}
#items{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center;min-height:0;overflow:auto}
.item{background:#fff8e6;border-radius:18px;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  touch-action:none;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.18);position:relative}
.item svg{width:100%;height:clamp(60px,12vh,110px);pointer-events:none}
.item span{font-weight:800;font-size:clamp(14px,2vw,20px);pointer-events:none}
.labels-off .item span{display:none}
.item.dragging{opacity:.35}
.item.used{opacity:.6}
.item.used::after{content:"✓";position:absolute;right:8px;top:2px;font-size:26px;color:#16a34a;font-weight:900}
.item.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.item.sel{outline:5px solid #fde047}
.item.hint{animation:hint .8s infinite alternate;outline:5px solid #fde047}
@keyframes hint{from{transform:scale(1)}to{transform:scale(1.08)}}
.ghost{position:fixed;z-index:50;width:130px;height:130px;pointer-events:none;transform:translate(-50%,-60%) scale(1.1);
  filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ghost svg{width:100%;height:100%}

#palWrap{background:rgba(255,255,255,.35);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#palLabel{font-weight:800;font-size:clamp(14px,1.8vw,18px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);text-align:center}
#palette{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.sw{width:clamp(24px,2.5vw,30px);height:clamp(24px,2.5vw,30px);border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);padding:0}
.sw.on{outline:4px solid #3b2f63;transform:scale(1.12)}
@media (max-aspect-ratio:1/1){
  main{flex-direction:column}
  #closet{width:auto}
  #items{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));max-height:30vh}
  .item svg{height:clamp(50px,9vh,80px)}
}

/* ---------- Win ---------- */
#win{position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;text-align:center}
#win h2{margin:0;font-size:clamp(40px,9vw,90px);color:#e11d48;text-shadow:0 5px 0 #fff;animation:bounce .8s}
#win p{margin:0;font-size:clamp(18px,3vw,30px);font-weight:800}
.btn{background:#22c55e;color:#fff;font-size:clamp(18px,3vw,28px);font-weight:800;padding:12px 28px;border-radius:999px;box-shadow:0 6px 0 #15803d}
.btn.alt{background:#3b82f6;box-shadow:0 6px 0 #1d4ed8}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<!-- Màn chọn bé -->
<section id="start" class="screen">
  <button id="gear" title="Cài đặt">⚙️</button>
  <div id="settings" class="hidden">
    <label><input type="checkbox" id="optLabels" checked> Hiện chữ dưới món đồ</label>
    <label><input type="checkbox" id="optSound" checked> Bật âm thanh</label>
    <small>Đổi ảnh bé trai:</small>
    <input type="file" id="fileBoy" accept="image/*">
    <small>Đổi ảnh bé gái:</small>
    <input type="file" id="fileGirl" accept="image/*">
  </div>
  <h1>👕 Dress Up! 👗</h1>
  <p>Choose your friend!</p>
  <div class="pick">
    <button class="card" id="pickBoy"><div id="prevBoy" style="height:100%"></div><span>Boy</span></button>
    <button class="card" id="pickGirl"><div id="prevGirl" style="height:100%"></div><span>Girl</span></button>
  </div>
</section>

<!-- Màn chơi -->
<section id="game" class="screen hidden">
  <header>
    <button class="ib" id="btnHome" title="Về màn chọn">🏠</button>
    <div id="promptBox">👕 Dress Up! 👗</div>
    <button class="ib" id="btnRestart" title="Cởi hết đồ">🔄</button>
    <button class="ib" id="btnSound" title="Âm thanh">🔊</button>
  </header>
  <main>
    <div id="stage">
      <svg id="charSvg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <g id="charLayer"></g>
        <g id="clothesLayer"></g>
      </svg>
    </div>
    <aside id="closet">
      <h2>🚪 Closet</h2>
      <div id="palWrap"><div id="palLabel"></div><div id="palette"></div></div>
      <div id="items"></div>
    </aside>
  </main>
  </section>

const LABEL = {tshirt:'T-shirt', shorts:'shorts', shoes:'shoes', hat:'hat', dress:'dress'};
const ZORDER = {dress:1, shorts:2, tshirt:3, shoes:4, hat:5};

/* ---------- Hình quần áo (vẽ chi tiết: đổ bóng, nếp vải, đường may, họa tiết) ---------- */
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t));};
const lighten=(c,t)=>mix(c,'#ffffff',t), darken=(c,t)=>mix(c,'#000000',t);

let DEFS='<filter id="fsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".28"/></filter>';
let GID=0;
/* gradient ngang: tối ở mép, sáng ở giữa -> cảm giác vải phồng */
const gH=c=>{const id='cg'+(GID++);DEFS+=`<linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0">
  <stop offset="0" stop-color="${darken(c,.3)}"/><stop offset=".22" stop-color="${c}"/><stop offset=".45" stop-color="${lighten(c,.22)}"/>
  <stop offset=".75" stop-color="${c}"/><stop offset="1" stop-color="${darken(c,.32)}"/></linearGradient>`;return `url(#${id})`;};
/* gradient dọc: sáng trên, tối dưới */
const gV=(c,a=.18,b=.28)=>{const id='cg'+(GID++);DEFS+=`<linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1">
  <stop offset="0" stop-color="${lighten(c,a)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${darken(c,b)}"/></linearGradient>`;return `url(#${id})`;};
const gR=c=>{const id='cg'+(GID++);DEFS+=`<radialGradient id="${id}" cx=".45" cy=".35" r=".8">
  <stop offset="0" stop-color="${lighten(c,.28)}"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${darken(c,.3)}"/></radialGradient>`;return `url(#${id})`;};

const fold=(d,w=7)=>`<path d="${d}" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="${w}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="${(w*.45).toFixed(1)}" stroke-linecap="round" transform="translate(4 -2)"/>`;
const stitch=(d,c='#fff',o=.8)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.6" stroke-dasharray="7 6" stroke-linecap="round" opacity="${o}"/>`;
const shade=(d,o=.16)=>`<path d="${d}" fill="rgba(0,0,0,${o})"/>`;
const glow=(d,o=.22)=>`<path d="${d}" fill="rgba(255,255,255,${o})"/>`;
const star=(cx,cy,r)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.5:r;
  p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${gR('#fcd34d')}" stroke="#b45309" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="${cx-r*.22}" cy="${cy-r*.2}" rx="${r*.16}" ry="${r*.09}" fill="#fff" opacity=".6" transform="rotate(-35 ${cx-r*.22} ${cy-r*.2})"/>`;};
const heart=(cx,cy,s)=>`<path d="M${cx} ${cy+s*.95} C${cx-s*1.7} ${cy-s*.1} ${cx-s*.85} ${cy-s*1.25} ${cx} ${cy-s*.4} C${cx+s*.85} ${cy-s*1.25} ${cx+s*1.7} ${cy-s*.1} ${cx} ${cy+s*.95}Z"
  fill="${gR('#fb7185')}" stroke="#be123c" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="${cx-s*.6}" cy="${cy-s*.45}" rx="${s*.22}" ry="${s*.12}" fill="#fff" opacity=".6" transform="rotate(-30 ${cx-s*.6} ${cy-s*.45})"/>`;

/* áo thun: dùng chung cho bé trai / bé gái */
const tee=(c,d,collar,extra,print)=>`<g filter="url(#fsh)">
  <path d="${d}" fill="${gH(c)}" stroke="${darken(c,.45)}" stroke-width="4" stroke-linejoin="round"/>
  ${extra}
  <path d="${collar}" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="17" stroke-linecap="round" transform="translate(0 4)"/>
  <path d="${collar}" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
  <path d="${collar}" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="3 4" transform="translate(0 2)"/>
  ${print}</g>`;

/* quần short: cạp chun, dây rút, túi, gấu may chỉ */
const shorts=(c,o)=>{
  const dark=darken(c,.3);
  return `<g filter="url(#fsh)">
  <path d="${o.leg}" fill="${gH(c)}" stroke="${darken(c,.45)}" stroke-width="4" stroke-linejoin="round"/>
  ${shade(o.crotch,.22)}
  <path d="${o.band}" fill="${dark}" stroke="${darken(c,.5)}" stroke-width="3" stroke-linejoin="round"/>
  ${o.ribs}
  <path d="${o.cordL}" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <path d="${o.cordR}" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="${o.knot[0]}" cy="${o.knot[1]}" r="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <path d="${o.pocketL}" fill="none" stroke="${darken(c,.4)}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="${o.pocketR}" fill="none" stroke="${darken(c,.4)}" stroke-width="3.5" stroke-linecap="round"/>
  ${stitch(o.pocketL,lighten(c,.5),.7)}${stitch(o.pocketR,lighten(c,.5),.7)}
  ${stitch(o.hemL,lighten(c,.55))}${stitch(o.hemR,lighten(c,.55))}
  ${o.folds}</g>`;};
const ribs=(x0,x1,y0,y1,n)=>{let s='';for(let i=1;i<n;i++){const x=x0+(x1-x0)*i/n;s+=`<path d="M${x.toFixed(1)} ${y0} V${y1}" stroke="rgba(0,0,0,.2)" stroke-width="2.5"/>`;}return s;};

/* giày (nhìn thẳng từ phía trước) */
const sneaker=(x,y,w,h,c)=>{
  const body=`M${x+4} ${y+h*.62} C${x} ${y+h*.2} ${x+w*.2} ${y} ${x+w*.5} ${y} C${x+w*.8} ${y} ${x+w} ${y+h*.2} ${x+w-4} ${y+h*.62} C${x+w} ${y+h*.9} ${x+w-6} ${y+h} ${x+w-18} ${y+h} H${x+18} C${x+6} ${y+h} ${x} ${y+h*.9} ${x+4} ${y+h*.62}Z`;
  const cap=`M${x+7} ${y+h-17} C${x+9} ${y+h*.5} ${x+w-9} ${y+h*.5} ${x+w-7} ${y+h-17}Z`;
  const sole=`M${x+1} ${y+h-17} H${x+w-1} C${x+w+3} ${y+h-6} ${x+w-8} ${y+h+2} ${x+w-18} ${y+h+2} H${x+18} C${x+8} ${y+h+2} ${x-3} ${y+h-6} ${x+1} ${y+h-17}Z`;
  const cx=x+w/2;
  return `<g filter="url(#fsh)"><path d="${body}" fill="${gH(c)}" stroke="${darken(c,.45)}" stroke-width="4" stroke-linejoin="round"/>
  <path d="${cap}" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
  ${stitch(`M${x+14} ${y+h*.56} C${x+w*.3} ${y+h*.46} ${x+w*.7} ${y+h*.46} ${x+w-14} ${y+h*.56}`,'#94a3b8',.9)}
  <path d="${sole}" fill="#fff" stroke="#cbd5e1" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M${x+6} ${y+h-6} H${x+w-6}" stroke="${darken(c,.15)}" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M${x+w*.22} ${y+9} C${x+w*.3} ${y+2} ${x+w*.7} ${y+2} ${x+w*.78} ${y+9}" fill="none" stroke="${darken(c,.45)}" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="${cx}" cy="${y+h*.3}" rx="${w*.17}" ry="${h*.14}" fill="${lighten(c,.45)}" stroke="${darken(c,.35)}" stroke-width="2.5"/>
  <path d="M${x+w*.3} ${y+h*.26} L${x+w*.7} ${y+h*.4} M${x+w*.7} ${y+h*.26} L${x+w*.3} ${y+h*.4} M${x+w*.28} ${y+h*.4} L${x+w*.72} ${y+h*.5}" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="${x+w*.3}" cy="${y+h*.22}" rx="${w*.12}" ry="${h*.07}" fill="#fff" opacity=".45" transform="rotate(-25 ${x+w*.3} ${y+h*.22})"/></g>`;};
const maryjane=(x,y,w,h,c)=>{
  const body=`M${x+4} ${y+h*.62} C${x} ${y+h*.2} ${x+w*.2} ${y} ${x+w*.5} ${y} C${x+w*.8} ${y} ${x+w} ${y+h*.2} ${x+w-4} ${y+h*.62} C${x+w} ${y+h*.9} ${x+w-6} ${y+h} ${x+w-18} ${y+h} H${x+18} C${x+6} ${y+h} ${x} ${y+h*.9} ${x+4} ${y+h*.62}Z`;
  const strap=`M${x+3} ${y+h*.3} C${x+w*.3} ${y+h*.44} ${x+w*.7} ${y+h*.44} ${x+w-3} ${y+h*.3} V${y+h*.5} C${x+w*.7} ${y+h*.64} ${x+w*.3} ${y+h*.64} ${x+3} ${y+h*.5}Z`;
  const sole=`M${x+1} ${y+h-12} H${x+w-1} C${x+w+2} ${y+h-4} ${x+w-8} ${y+h+2} ${x+w-18} ${y+h+2} H${x+18} C${x+8} ${y+h+2} ${x-2} ${y+h-4} ${x+1} ${y+h-12}Z`;
  return `<g filter="url(#fsh)"><path d="${body}" fill="${gH(c)}" stroke="${darken(c,.5)}" stroke-width="4" stroke-linejoin="round"/>
  <path d="${strap}" fill="${gH(darken(c,.12))}" stroke="${darken(c,.5)}" stroke-width="3" stroke-linejoin="round"/>

let ac=null;
function initAudio(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
function tone(f,t0,d,type,vol,slide){
  if(!ac||!state.sound) return;
  const t=ac.currentTime+t0, o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.05);
}
const sfx={
  pick(){ tone(660,0,.08,'triangle',.15); },
  ok(){ [784,988,1319].forEach((f,i)=>tone(f,i*.09,.25,'sine',.28)); },
  wrong(){ tone(240,0,.2,'sawtooth',.16,170); tone(170,.2,.3,'sawtooth',.16,110); },
  win(){ [523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.28)); }
};

/* ---------- Trạng thái ---------- */
const $=s=>document.querySelector(s);

  if(typeof sv.labels==='boolean') state.labels=sv.labels; if(typeof sv.sound==='boolean') state.sound=sv.sound; }catch(e){}

/* ---------- Ảnh nhân vật ---------- */
const srcOf=k=>custom[k]||CHAR[k].src;
function probe(k){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{imgOK[k]=true;res()}; im.onerror=()=>{imgOK[k]=false;res()}; im.src=srcOf(k); }); }
const charInner=k=> imgOK[k] ? `<image href="${srcOf(k)}" x="0" y="0" width="1024" height="1024"/>` : fallback(k);
function renderStart(){
  $('#prevBoy').innerHTML=`<svg viewBox="${VBSTR}" style="height:100%;width:auto" xmlns="http://www.w3.org/2000/svg">${charInner('boy')}</svg>`;
  $('#prevGirl').innerHTML=`<svg viewBox="${VBSTR}" style="height:100%;width:auto" xmlns="http://www.w3.org/2000/svg">${charInner('girl')}</svg>`;
}

/* ---------- Vẽ món đồ theo màu (có nhớ lại để khỏi vẽ lại) ---------- */
let FLUSHED=DEFS.length;
function flushDefs(){ const d=DEFS.slice(FLUSHED); FLUSHED=DEFS.length; if(d) document.getElementById('gdefs').insertAdjacentHTML('beforeend',d); }
const cache={};
function artSvg(k,key,c){ const id=k+'|'+key+'|'+c; if(!cache[id]){ cache[id]=ART[k][key].svg(c); flushDefs(); } return cache[id]; }

/* ---------- Màn hình ---------- */
function show(id){ ['#start','#game'].forEach(s=>$(s).classList.add('hidden')); $(id).classList.remove('hidden'); }

function startGame(k){
  initAudio();
  state.who=k; show('#game');
  $('#charSvg').setAttribute('viewBox',VBSTR);
  $('#charLayer').innerHTML=charInner(k);
  buildCloset(); undressAll();
  select(CHAR[k].items[0]);
}
function buildCloset(){
  const box=$('#items'); box.innerHTML='';
  CHAR[state.who].items.forEach(key=>{
    const [x,y,w,h]=ART[state.who][key].bbox;
    const el=document.createElement('div'); el.className='item'; el.dataset.key=key;
    el.innerHTML=`<svg viewBox="${x} ${y} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${artSvg(state.who,key,state.colors[state.who][key])}</svg><span></span>`;
    el.querySelector('span').textContent=LABEL[key];
    el.addEventListener('pointerdown',e=>onDown(e,key,el));
    box.appendChild(el);
  });
}
function undressAll(){
  $('#clothesLayer').innerHTML=''; state.worn.clear();
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('used','dragging'));
  clearTimeout(danceTimer); $('#charSvg').classList.remove('dance');
}

/* ---------- Chọn món & đổi màu ---------- */
function select(key){
  state.sel=key;
  document.querySelectorAll('.item').forEach(i=>i.classList.toggle('sel',i.dataset.key===key));
  buildPalette();
}
function buildPalette(){
  const box=$('#palette'); box.innerHTML='';
  const cur=state.colors[state.who][state.sel];
  PALETTE.forEach(c=>{
    const b=document.createElement('button'); b.className='sw'+(c===cur?' on':''); b.style.background=c; b.setAttribute('aria-label',c);
    b.addEventListener('click',()=>setColor(c)); box.appendChild(b);
  });
  $('#palLabel').textContent='🎨 '+LABEL[state.sel];
}
function setColor(c){
  initAudio(); state.colors[state.who][state.sel]=c; refreshItem(state.sel); buildPalette(); sfx.pick();
}
function refreshItem(key){
  const svg=artSvg(state.who,key,state.colors[state.who][key]);
  const icon=document.querySelector(`.item[data-key="${key}"] svg`); if(icon) icon.innerHTML=svg;
  const g=document.querySelector(`#clothesLayer .cloth[data-key="${key}"]`); if(g) g.innerHTML=svg;
}

/* ---------- Mặc / cởi ---------- */
function wear(key){
  const old=document.querySelector(`#clothesLayer .cloth[data-key="${key}"]`); if(old) old.remove();
  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','cloth pop'); g.dataset.key=key; g.dataset.z=ZORDER[key];
  g.innerHTML=artSvg(state.who,key,state.colors[state.who][key]);
  g.addEventListener('click',()=>takeOff(key));          // chạm vào đồ đang mặc để cởi ra
  const layer=$('#clothesLayer'); layer.appendChild(g);
  [...layer.children].sort((p,q)=>p.dataset.z-q.dataset.z).forEach(n=>layer.appendChild(n));
  state.worn.add(key);
  document.querySelector(`.item[data-key="${key}"]`).classList.add('used');
  sfx.ok();
  if(state.worn.size===CHAR[state.who].items.length) setTimeout(celebrate,500);
}
function takeOff(key){
  const g=document.querySelector(`#clothesLayer .cloth[data-key="${key}"]`); if(g) g.remove();
  state.worn.delete(key);
  const it=document.querySelector(`.item[data-key="${key}"]`); if(it) it.classList.remove('used');
  sfx.pick();
}
function celebrate(){
  sfx.win(); const s=$('#charSvg'); s.classList.add('dance'); confetti();
  clearTimeout(danceTimer); danceTimer=setTimeout(()=>s.classList.remove('dance'),2600);
}
function confetti(){
  const cols=['#ef4444','#f97316','#fde047','#22c55e','#3b82f6','#a855f7','#ec4899'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div'); c.className='confetti';
    c.style.left=Math.random()*100+'vw'; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2+Math.random()*2.5)+'s'; c.style.animationDelay=(Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),5200);
  }
}

/* ---------- Kéo thả (chạm nhẹ = chọn món để đổi màu) ---------- */
function onDown(e,key,el){
  e.preventDefault(); initAudio();
  drag={key,el,ghost:null,x0:e.clientX,y0:e.clientY};
  select(key);
}
function inStage(e){ const r=$('#stage').getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; }
function moveGhost(e){
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8) return;
    const g=document.createElement('div'); g.className='ghost'; g.appendChild(drag.el.querySelector('svg').cloneNode(true));
    document.body.appendChild(g); drag.ghost=g; drag.el.classList.add('dragging'); sfx.pick();
  }
  drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
  $('#stage').classList.toggle('over',inStage(e));
}
window.addEventListener('pointermove',moveGhost);
window.addEventListener('pointerup',e=>{
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.ghost) return;                                   // chỉ chạm nhẹ: đã chọn món
  d.ghost.remove(); d.el.classList.remove('dragging'); $('#stage').classList.remove('over');
  if(inStage(e)) wear(d.key);
});
window.addEventListener('pointercancel',()=>{
  if(!drag) return;
  if(drag.ghost){ drag.ghost.remove(); drag.el.classList.remove('dragging'); }
  drag=null; $('#stage').classList.remove('over');
});

/* ---------- Nút & cài đặt ---------- */
$('#pickBoy').onclick=()=>startGame('boy');
$('#pickGirl').onclick=()=>startGame('girl');
$('#btnHome').onclick=()=>show('#start');
$('#btnRestart').onclick=()=>{ initAudio(); undressAll(); sfx.pick(); };
$('#gear').onclick=()=>$('#settings').classList.toggle('hidden');
function applyOpts(){
  $('#optLabels').checked=state.labels; $('#optSound').checked=state.sound;
  $('#game').classList.toggle('labels-off',!state.labels);
  $('#btnSound').textContent=state.sound?'🔊':'🔇';
}
$('#optLabels').onchange=e=>{state.labels=e.target.checked; applyOpts(); saveOpts();};
$('#optSound').onchange=e=>{state.sound=e.target.checked; applyOpts(); saveOpts();};
$('#btnSound').onclick=()=>{state.sound=!state.sound; applyOpts(); saveOpts(); initAudio();};
function loadFile(k,file){
  if(!file) return; const fr=new FileReader();
  fr.onload=async()=>{ custom[k]=fr.result; await probe(k); renderStart(); };
  fr.readAsDataURL(file);
}
$('#fileBoy').onchange=e=>loadFile('boy',e.target.files[0]);
$('#fileGirl').onchange=e=>loadFile('girl',e.target.files[0]);

/* ---------- Khởi động ---------- */
applyOpts();
Promise.all([probe('boy'),probe('girl')]).then(renderStart);
</script>
</body>
</html>
