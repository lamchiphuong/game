<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Little Warrior vs. Dinosaur</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06281a;
  font-family:"Baloo 2","Fredoka","Comic Sans MS","Chalkboard SE","Segoe UI",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;
  transform:translate(-50%,-50%);overflow:hidden;background:#7fd3ff;border-radius:10px}
#world{position:absolute;inset:0}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:78px;z-index:12;display:flex;align-items:center;
  justify-content:space-between;padding:12px 22px;pointer-events:none}
.box{background:rgba(255,255,255,.86);border-radius:44px;padding:4px 20px;display:flex;align-items:center;gap:10px;
  box-shadow:0 5px 0 rgba(0,0,0,.18);font-weight:800;color:#2d5016;height:54px}
#hearts{gap:4px}
#hearts span{font-size:38px;line-height:1;transition:transform .3s,opacity .3s,filter .3s;display:inline-block}
#hearts span.lost{filter:grayscale(1);opacity:.4;transform:scale(.72)}
#hearts span.pop{animation:heartbreak .6s}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.7) rotate(-14deg)}60%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(.72)}}
#roundTxt{font-size:24px;white-space:nowrap}
#pips{display:flex;gap:6px}
#pips i{width:18px;height:18px;border-radius:50%;background:#cfd8c4;border:3px solid #7a9a5a;display:block}
#pips i.done{background:#ffc300;border-color:#d99100}
#pips i.now{background:#ff6b35;border-color:#c1440e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
#hudBtns{display:flex;gap:10px;pointer-events:auto}
.icon{width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:26px;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.18);padding:0}
.icon:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.icon.off{opacity:.55;filter:grayscale(1)}

/* ---------- characters ---------- */
.char{position:absolute;pointer-events:none}
.char::after{content:"";position:absolute;left:8%;right:8%;bottom:-10px;height:26px;border-radius:50%;
  background:radial-gradient(rgba(0,0,0,.34),rgba(0,0,0,0) 70%);z-index:-1}
#hero{left:30px;bottom:50px;width:314px;height:300px;z-index:4;transform-origin:50% 100%}
#hero img{width:100%;height:100%;display:block;animation:bob 1.3s ease-in-out infinite;transform-origin:50% 100%}
#dino{right:44px;bottom:44px;width:230px;height:360px;z-index:6;transform-origin:50% 100%}
#dinoBody{position:absolute;inset:0;transform:scale(var(--s,.85));transform-origin:50% 100%;
  animation:dinobob 1.7s ease-in-out infinite}
#dinoBody img{width:100%;height:100%;display:block;filter:hue-rotate(var(--hue,0deg))}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.01,.99)}}
@keyframes dinobob{0%,100%{transform:scale(var(--s,.85)) translateY(0)}50%{transform:scale(var(--s,.85)) translateY(-9px)}}

#hpbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(360px * var(--s,.85) + 6px);display:flex;gap:6px;
  background:rgba(255,255,255,.9);padding:6px 12px;border-radius:30px;box-shadow:0 4px 0 rgba(0,0,0,.2);white-space:nowrap;
  font-weight:800;color:#8c1c13;font-size:18px;align-items:center;z-index:2}
#hpbar i{width:26px;height:16px;border-radius:8px;background:#e63946;border:2px solid #9d0208;display:block;transition:.3s}
#hpbar i.gone{background:#ddd;border-color:#aaa;transform:scale(.7)}

/* character animations */
@keyframes enter{0%{transform:translateX(560px);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes lunge{0%{transform:translate(0,0)}28%{transform:translate(-610px,-18px) rotate(-5deg)}
  50%{transform:translate(-600px,0) rotate(3deg)}62%{transform:translate(-610px,-14px) rotate(-3deg)}100%{transform:translate(0,0)}}
@keyframes dinohit{0%,100%{transform:none}15%{transform:translateX(18px) rotate(3deg)}35%{transform:translateX(-14px) rotate(-3deg)}
  55%{transform:translateX(12px)}75%{transform:translateX(-8px)}}
@keyframes flash{0%,100%{filter:hue-rotate(var(--hue,0deg)) brightness(1)}30%,70%{filter:hue-rotate(var(--hue,0deg)) brightness(2.6) saturate(.4)}}
@keyframes redflash{0%,100%{filter:none}25%,70%{filter:sepia(1) saturate(6) hue-rotate(-40deg) brightness(1.1)}}
@keyframes die{0%{transform:none;opacity:1}25%{transform:translateY(-26px) rotate(-8deg)}
  100%{transform:translate(160px,90px) rotate(55deg) scale(.15);opacity:0}}
@keyframes throwA{0%{transform:none}30%{transform:translateX(46px) rotate(7deg) scale(1.03)}100%{transform:none}}
@keyframes hurtA{0%{transform:none}15%{transform:translateX(-46px) rotate(-9deg)}32%{transform:translateX(-18px)}
  50%{transform:translateX(-38px) rotate(-6deg)}100%{transform:none}}
@keyframes cheerA{0%,100%{transform:none}30%{transform:translateY(-70px) rotate(-4deg)}55%{transform:none}75%{transform:translateY(-34px) rotate(3deg)}}
#dino.enter{animation:enter .9s ease-out both}
#dino.lunge{animation:lunge 1.15s ease-in-out both}
#dino.hit{animation:dinohit .5s}
#dino.hit #dinoBody img{animation:flash .5s}
#dino.die{animation:die 1s ease-in forwards}
#hero.throw{animation:throwA .55s}
#hero.hurt{animation:hurtA .7s}
#hero.hurt img{animation:redflash .7s}
#hero.cheer{animation:cheerA 1s}
#hero.down{transform:rotate(-16deg) translate(-8px,30px);filter:grayscale(.75) brightness(.85);transition:all .8s}
#hero.down img{animation:none}
#world.shake{animation:wshake .45s}
@keyframes wshake{0%,100%{transform:none}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,4px)}80%{transform:translate(5px,-3px)}}

/* ---------- drawing panel ---------- */
#panel{position:absolute;left:400px;top:88px;width:480px;z-index:5;display:flex;flex-direction:column;gap:9px}
#prompt{background:linear-gradient(#fffbe3,#ffeaa0);border:4px solid #ffb703;border-radius:26px;padding:7px 14px 7px 10px;
  display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 #d98c00;height:112px}
#sample{width:108px;height:96px;flex:none;background:#fff;border-radius:20px;border:3px solid #ffb703;box-shadow:inset 0 0 0 3px #fff6cf}
#wLine{font-size:18px;font-weight:800;color:#c1440e;white-space:nowrap;line-height:1.15;margin-bottom:2px}
#ptxt{flex:1;min-width:0}
#shapeEN{font-size:44px;font-weight:900;letter-spacing:1px;color:#d62828;line-height:1.05;display:inline-block}
#shapeEN.pop{animation:wordpop .5s}
@keyframes wordpop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
#btnSpeak{width:50px;height:50px;font-size:24px}
#padWrap{position:relative;height:340px;border-radius:26px;overflow:hidden;border:5px dashed #5fa83a;
  background:radial-gradient(circle at 20% 20%,#fff 0,#fffdf2 100%);box-shadow:0 6px 0 rgba(0,0,0,.2)}
#padWrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#pad{touch-action:none;cursor:crosshair}
#padHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#a8b79a;font-weight:800;font-size:20px;pointer-events:none;transition:opacity .3s}
#padBtns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:22px;font-size:20px;font-weight:800;padding:11px 8px;cursor:pointer;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.28);font-family:inherit;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.btn:disabled{filter:grayscale(.8);opacity:.7}
#btnGo{flex:1.7;background:linear-gradient(#ff8a5b,#e63946);font-size:24px}
#btnClear{background:linear-gradient(#63b3ff,#2f6fe0)}
#btnHint{background:linear-gradient(#ffd84a,#e9a400);color:#5a3d00}
#btnHint.on{outline:4px solid #fff}

/* ---------- effects ---------- */
#fx{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.weapon{position:absolute;left:0;top:0;z-index:16;pointer-events:none;transform-origin:50% 50%}
.weapon canvas{width:100%;height:100%;display:block}
.weapon span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:60px;filter:drop-shadow(0 0 10px #fff)}
.weapon.charge{animation:charge .38s ease-out}
@keyframes charge{0%{transform:var(--t0) scale(1)}50%{transform:var(--t0) scale(1.22)}100%{transform:var(--t0) scale(1.1)}}
.p{position:absolute;font-size:30px;animation:pfly .95s ease-out forwards}
@keyframes pfly{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1);opacity:0}}
.word{position:absolute;font-size:60px;font-weight:900;color:#fff;-webkit-text-stroke:9px #e63946;paint-order:stroke fill;
  transform:translate(-50%,-50%);animation:wordA .9s ease-out forwards;white-space:nowrap}
@keyframes wordA{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25) rotate(6deg);opacity:1}
  70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(0);opacity:0}}
#toast{position:absolute;left:50%;top:300px;z-index:20;text-align:center;pointer-events:none;opacity:0;white-space:nowrap;
  font-size:50px;font-weight:900;color:#fff;-webkit-text-stroke:10px #2d8a4e;paint-order:stroke fill;line-height:1.1}
#toast small{display:block;font-size:26px;-webkit-text-stroke:6px #2d8a4e;margin-top:4px}
#toast.bad,#toast.bad small{-webkit-text-stroke-color:#b0182a}
#toast.info,#toast.info small{-webkit-text-stroke-color:#d98c00}
#toast.show{animation:toastA 1.7s ease forwards}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,24px) scale(.5)}12%{opacity:1;transform:translate(-50%,0) scale(1.15)}22%{transform:translate(-50%,0) scale(1)}
  82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-30px)}}
#banner{position:absolute;left:0;right:0;top:230px;z-index:21;text-align:center;pointer-events:none;opacity:0}
#banner b{display:block;font-size:110px;font-weight:900;color:#fff;-webkit-text-stroke:16px #d62828;paint-order:stroke fill;line-height:1;
  text-shadow:0 10px 0 rgba(0,0,0,.2)}
#banner span{display:inline-block;margin-top:12px;font-size:36px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);padding:6px 26px;border-radius:30px}
#banner.show{animation:bannerA 1.8s ease forwards}
@keyframes bannerA{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.12)}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.15)}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(8,70,35,.45),rgba(4,25,14,.88))}
.card{background:linear-gradient(#fffbe8,#fff0b8);border:6px solid #ffb703;border-radius:38px;padding:26px 44px 30px;text-align:center;
  box-shadow:0 10px 0 #d98c00,0 24px 60px rgba(0,0,0,.5);max-width:900px;animation:cardin .6s ease-out}
@keyframes cardin{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.card h1{margin:0 0 4px;font-size:50px;line-height:1.08;color:#d62828;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.card h2{margin:0 0 6px;font-size:26px;color:#6b4e00}
.card .row{display:flex;align-items:flex-end;justify-content:center;gap:26px;margin:6px 0 4px}
.card .row img{display:block;height:200px;animation:bob 1.4s ease-in-out infinite}
.card ul{list-style:none;margin:6px 0 14px;padding:0;text-align:left;font-size:24px;font-weight:700;color:#4a3a00}
.card li{margin:6px 0}
.bigbtn{border:0;border-radius:40px;font-size:34px;font-weight:900;padding:14px 54px;color:#fff;cursor:pointer;font-family:inherit;
  background:linear-gradient(#5be37d,#16a34a);box-shadow:0 8px 0 #0e7a35;animation:pulseBtn 1.2s infinite}
.bigbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #0e7a35}
@keyframes pulseBtn{50%{transform:scale(1.06)}}
#stars{font-size:70px;letter-spacing:6px;margin:4px 0 8px}
#rotate{position:fixed;inset:0;z-index:99;background:#0b3d24;color:#fff;display:none;align-items:center;justify-content:center;
  text-align:center;font-size:28px;font-weight:800;padding:30px;flex-direction:column;gap:12px}
#rotate div{font-size:80px}
@media (orientation:portrait) and (max-width:600px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <div id="world">
   <img id="bg" data-img="bg" alt="">
   <div id="hero" class="char"><img data-img="hero" alt="Little warrior"></div>
   <div id="dino" class="char">
     <div id="hpbar"></div>
     <div id="dinoBody"><img data-img="dino" alt="Dinosaur"></div>
   </div>
   <div id="panel">
     <div id="prompt">
       <canvas id="sample" width="216" height="192"></canvas>
       <div id="ptxt">
         <div id="wLine">🔥 Fireball</div>
         <div><span id="shapeEN">CIRCLE</span></div>
       </div>
       <button class="icon" id="btnSpeak" title="Listen">🔊</button>
     </div>
     <div id="padWrap">
       <canvas id="guide"></canvas>
       <canvas id="pad"></canvas>
       <div id="padHint">✏️ Draw here!</div>
     </div>
     <div id="padBtns">
       <button class="btn" id="btnClear">🧽 Clear</button>
       <button class="btn" id="btnHint">💡 Trace</button>
       <button class="btn" id="btnGo">⚔️ Attack!</button>
     </div>
   </div>
  </div>
  <div id="fx"></div>
  <div id="hud">
    <div class="box" id="hearts"></div>
    <div class="box"><span id="roundTxt">Round 1/5</span><div id="pips"></div></div>
    <div id="hudBtns">
      <button class="icon" id="btnMusic" title="Music">🎵</button>
      <button class="icon" id="btnSound" title="Sound">🔊</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="banner"><b id="bannerBig">ROUND 1</b><span id="bannerSub"></span></div>

  <div id="startOv" class="overlay">
    <div class="card">
      <h1>⚔️ Little Warrior<br>vs. Dinosaur 🦖</h1>
      <div class="row"><img data-img="hero" alt=""><img data-img="dino" alt="" style="height:180px"></div>
      <ul>
        <li>✏️ Look at the picture and <b>draw the shape</b> to make a weapon!</li>
        <li>❤️ You have <b>3 hearts</b>. A wrong drawing costs a heart.</li>
        <li>🏆 Beat the dinosaur in <b>5 rounds</b> to win!</li>
      </ul>
      <button class="bigbtn" id="btnStart">▶ START</button>
    </div>
  </div>
  <div id="endOv" class="overlay hidden">
    <div class="card">
      <h1 id="endTitle"></h1>
      <h2 id="endSub"></h2>
      <div id="stars"></div>
      <button class="bigbtn" id="btnAgain">🔄 Play again</button>
    </div>
  </div>
 </div>
</div>
<div id="rotate"><div>📱↻</div>Please rotate your screen to play!</div>

<script>
/* ===== Shape recognizer (no dependencies) =====
   Compares the child's ink with many template outlines using a symmetric
   chamfer distance, so it does not care where the child started, which
   direction they drew, whether they lifted the finger, or small gaps. */
const Recognizer = (function () {
  const N = 72;            // points per template
  const INK_POINTS = 96;   // points sampled from the child's ink
  const CMAX = 0.24;       // chamfer distance that maps to 0%
  const THRESH = 70;       // pass mark (%)
  const MARGIN = 6;        // target may trail the best other shape by this much

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function resampleClosed(pts, n) {
    const p = pts.concat([pts[0]]);
    let L = 0;
    for (let i = 1; i < p.length; i++) L += dist(p[i - 1], p[i]);
    if (L < 1e-6) return null;
    const step = L / n;
    const out = [{ x: p[0].x, y: p[0].y }];
    let need = step;
    for (let i = 1; i < p.length && out.length < n; i++) {
      let a = p[i - 1];
      const b = p[i];
      let seg = dist(a, b);
      while (seg >= need && out.length < n) {
        const t = need / seg;
        const q = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        out.push(q);
        a = q;
        seg = dist(a, b);
        need = step;
      }
      need -= seg;
    }
    while (out.length < n) out.push({ x: p[0].x, y: p[0].y });
    return out;
  }

  function resampleOpen(pts, step) {
    const out = [{ x: pts[0].x, y: pts[0].y }];
    let need = step;
    for (let i = 1; i < pts.length; i++) {
      let a = pts[i - 1];
      const b = pts[i];
      let seg = dist(a, b);
      while (seg >= need) {
        const t = need / seg;
        const q = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
        out.push(q);
        a = q;
        seg = dist(a, b);
        need = step;
      }
      need -= seg;
    }
    return out;
  }

  function bbox(pts) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of pts) {
      if (p.x < x0) x0 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.x > x1) x1 = p.x;
      if (p.y > y1) y1 = p.y;
    }
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }

  function normalize(pts) {
    const b = bbox(pts);
    const s = Math.max(b.w, b.h) || 1;
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    return pts.map(p => ({ x: (p.x - cx) / s, y: (p.y - cy) / s }));
  }

  function chamfer(A, B) {
    let sa = 0, sb = 0;
    for (const a of A) {
      let m = 1e9;
      for (const b of B) {
        const d = (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
        if (d < m) m = d;
      }
      sa += Math.sqrt(m);
    }
    for (const b of B) {
      let m = 1e9;
      for (const a of A) {
        const d = (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
        if (d < m) m = d;
      }
      sb += Math.sqrt(m);
    }
    return Math.max(sa / A.length, sb / B.length);
  }

  /* ---------- template outlines ---------- */
  function rectPoly(w, h, r) {
    const hw = w / 2, hh = h / 2;
    r = Math.min(r, hw, hh);
    if (r <= 1e-4) return [{ x: -hw, y: -hh }, { x: hw, y: -hh }, { x: hw, y: hh }, { x: -hw, y: hh }];
    const pts = [];
    const corners = [[hw - r, -hh + r, -90], [hw - r, hh - r, 0], [-hw + r, hh - r, 90], [-hw + r, -hh + r, 180]];
    for (const [cx, cy, a0] of corners) {
      for (let k = 0; k <= 6; k++) {
        const a = (a0 + k * 15) * Math.PI / 180;
        pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
      }
    }
    return pts;
  }

  function ellipsePoly(rx, ry) {
    const p = [];
    for (let i = 0; i < N; i++) {
      const t = i / N * 2 * Math.PI;
      p.push({ x: rx * Math.cos(t), y: ry * Math.sin(t) });
    }
    return p;
  }

  function heartPoly(sy) {
    const p = [];
    for (let i = 0; i < N * 2; i++) {
      const t = i / (N * 2) * 2 * Math.PI;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      p.push({ x, y: y * sy });
    }
    return p;
  }

  function starPoints(rin, rot) {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 1 : rin;
      const a = -Math.PI / 2 + rot + i * Math.PI / 5;
      p.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
    }
    return p;
  }

  function pentagram(rot) {
    const v = [];
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + rot + i * 2 * Math.PI / 5;
      v.push({ x: Math.cos(a), y: Math.sin(a) });
    }
    return [v[0], v[2], v[4], v[1], v[3]];
  }

  const T = { circle: [], square: [], rectangle: [], triangle: [], heart: [], star: [] };
  const GUIDE = {};

  function add(kind, poly, guide) {
    const r = resampleClosed(poly, N);
    if (!r) return;
    const n = normalize(r);
    let perim = 0;
    for (let i = 0; i < n.length; i++) perim += dist(n[i], n[(i + 1) % n.length]);
    T[kind].push({ pts: n, perim });
    if (guide) GUIDE[kind] = n;
  }

  // circle / oval
  add('circle', ellipsePoly(1, 1), true);
  for (const a of [0.85, 0.7]) { add('circle', ellipsePoly(1, a)); add('circle', ellipsePoly(a, 1)); }

  // square (kids often round the corners or make it a little wonky)
  add('square', rectPoly(1, 1, 0), true);
  for (const a of [1, 0.88, 0.78]) {
    for (const r of [0, 0.1]) {
      if (a === 1 && r === 0) continue;
      add('square', rectPoly(1, a, r));
      if (a < 1) add('square', rectPoly(a, 1, r));
    }
  }

  // rectangle, any proportion, lying down or standing up
  for (const a of [0.3, 0.45, 0.6, 0.72, 0.8]) {
    for (const r of [0, 0.1 * a]) {
      add('rectangle', rectPoly(1, a, r), a === 0.6 && r === 0);
      add('rectangle', rectPoly(a, 1, r));
    }
  }

  // triangle: any apex position, a few heights, pointing up or down
  for (const h of [0.6, 0.85, 1.1]) {
    for (const ax of [0, 0.25, 0.5, 0.75, 1]) {
      const up = [{ x: ax, y: 0 }, { x: 1, y: h }, { x: 0, y: h }];
      const down = [{ x: ax, y: h }, { x: 1, y: 0 }, { x: 0, y: 0 }];
      add('triangle', up, h === 0.85 && ax === 0.5);
      add('triangle', down);
    }
  }

  // heart
  for (const sy of [0.8, 0.95, 1.1, 1.25]) add('heart', heartPoly(sy), sy === 0.95);

  // star (outline or one-stroke pentagram, upright or upside-down)
  for (const rin of [0.382, 0.5, 0.62]) {
    add('star', starPoints(rin, 0), rin === 0.5);
    add('star', starPoints(rin, Math.PI / 5));
  }
  add('star', pentagram(0));
  add('star', pentagram(Math.PI / 5));

  /* ---------- public API ---------- */
  const ANGLES = [-15, -8, 0, 8, 15].map(d => d * Math.PI / 180);

  function rotateAbout(pts, a, cx, cy) {
    const c = Math.cos(a), s = Math.sin(a);
    return pts.map(p => ({ x: cx + (p.x - cx) * c - (p.y - cy) * s, y: cy + (p.x - cx) * s + (p.y - cy) * c }));
  }

  function analyze(strokes, minSize) {
    let ink = 0;
    const all = [];
    for (const s of strokes) {
      for (let i = 0; i < s.length; i++) {
        all.push(s[i]);
        if (i) ink += dist(s[i - 1], s[i]);
      }
    }
    if (all.length < 3) return { ok: false, reason: 'empty' };
    const b = bbox(all);
    const maxDim = Math.max(b.w, b.h);
    if (maxDim < (minSize || 40) || ink < maxDim * 1.2) return { ok: false, reason: 'small' };

    const step = Math.max(1, ink / INK_POINTS);
    let P = [];
    for (const s of strokes) {
      if (s.length === 0) continue;
      P = P.concat(s.length === 1 ? [s[0]] : resampleOpen(s, step));
    }
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;

    const bestC = {};
    for (const k in T) bestC[k] = 1e9;
    let boxBest = 1e9, boxAspect = Math.min(b.w, b.h) / Math.max(b.w, b.h);

    for (const ang of ANGLES) {
      const R = ang === 0 ? P : rotateAbout(P, ang, cx, cy);
      const rb = bbox(R);
      const rmax = Math.max(rb.w, rb.h) || 1;
      const norm = normalize(R);
      const inkNorm = ink / rmax;
      for (const k in T) {
        for (const t of T[k]) {
          let c = chamfer(norm, t.pts);
          const ratio = inkNorm / t.perim;
          if (ratio > 1.7) c += (ratio - 1.7) * 0.08;   // scribbles / lots of extra ink
          if (c < bestC[k]) bestC[k] = c;
          if ((k === 'square' || k === 'rectangle') && c < boxBest) {
            boxBest = c;
            boxAspect = Math.min(rb.w, rb.h) / Math.max(rb.w, rb.h);
          }
        }
      }
    }

    const scores = {};
    for (const k in T) scores[k] = Math.max(0, 100 * (1 - bestC[k] / CMAX));
    let bestKind = null, bestScore = -1;
    for (const kk in scores) if (scores[kk] > bestScore) { bestScore = scores[kk]; bestKind = kk; }
    return { ok: true, scores, aspect: boxAspect, best: bestKind, bestScore, bbox: b };
  }

  function judge(target, res) {
    const s = res.scores;
    const sibling = target === 'square' ? 'rectangle' : target === 'rectangle' ? 'square' : null;
    let maxOther = 0;
    for (const k in s) if (k !== target && k !== sibling && s[k] > maxOther) maxOther = s[k];
    let pass = s[target] >= THRESH && s[target] >= maxOther - MARGIN;
    if (pass && target === 'square' && res.aspect < 0.7) pass = false;
    if (pass && target === 'rectangle' && res.aspect > 0.85) pass = false;
    return { pass, percent: Math.round(Math.min(100, s[target])) };
  }

  return { analyze, judge, guide: kind => GUIDE[kind], templates: T, THRESH, CMAX };
})();

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), world = $('world'), fx = $('fx');
const hero = $('hero'), dino = $('dino');
const pad = $('pad'), guide = $('guide');
const ctx = pad.getContext('2d'), gctx = guide.getContext('2d');

document.querySelectorAll('[data-img]').forEach(el => { el.src = IMG[el.dataset.img]; });

/* ================= scale the 1280x720 stage to the window ================= */
let scale = 1;
function fit() {
  scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  stage.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
}
window.addEventListener('resize', fit); fit();

/* ================= data ================= */
const SHAPES = {
  circle:    { en: 'CIRCLE',    say: 'circle',    icon: '🔥', weapon: 'Fireball',      color: '#ffa43c' },
  square:    { en: 'SQUARE',    say: 'square',    icon: '⚡', weapon: 'Thunder Shield', color: '#ffd84a' },
  triangle:  { en: 'TRIANGLE',  say: 'triangle',  icon: '🧊', weapon: 'Ice Spear',      color: '#5fd3ff' },
  rectangle: { en: 'RECTANGLE', say: 'rectangle', icon: '⚔️', weapon: 'Light Sword',    color: '#9be45e' },
  heart:     { en: 'HEART',     say: 'heart',     icon: '💖', weapon: 'Magic Heart',    color: '#ff6fb0' },
  star:      { en: 'STAR',      say: 'star',      icon: '🌟', weapon: 'Shooting Star',  color: '#c79bff' }
};
const ALL = ['circle', 'square', 'triangle', 'rectangle', 'heart', 'star'];
const MAX_HEARTS = 3;
/* hits = number of correct drawings needed to defeat the dinosaur in that round (easy to change) */
const ROUNDS = [
  { name: 'Baby Dino',    hits: 2, pool: ['circle', 'square', 'triangle'],                        first: null,        hue: 0,   scale: 0.82 },
  { name: 'Mint Dino',   hits: 2, pool: ['circle', 'square', 'triangle', 'rectangle'],           first: 'rectangle', hue: 70,  scale: 0.92 },
  { name: 'Sunny Dino',   hits: 2, pool: ['circle', 'square', 'triangle', 'rectangle', 'heart'],  first: 'heart',     hue: -48, scale: 1.0 },
  { name: 'Purple Dino',    hits: 3, pool: ALL,                                                     first: 'star',      hue: 195, scale: 1.1 },
  { name: 'KING DINO',   hits: 3, pool: ALL,                                                     first: null,        hue: -92, scale: 1.22 }
];
const PRAISE = ['Amazing!', 'Great job!', 'Super!', 'Excellent!'];
const CHEER = ['Great!', 'Awesome!', 'Well done!', 'Super!'];

/* ================= sound (all synthesized, no files) ================= */
const Snd = (function () {
  let ac = null, master, sfxG, musG, noiseBuf;
  let sfxOn = true, musOn = true, timer = null, step = 0, nextT = 0;
  let voice = null;
  /* Prefer the male Google English voice (Chrome: "Google UK English Male"), then any other male-sounding English voice. */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const en = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
    if (!en.length) return;
    const by = re => en.find(v => re.test(v.name));
    voice = by(/Google UK English Male/i) || by(/Google.*Male/i) ||
            by(/\b(Male|Daniel|David|Alex|Guy|Mark|Fred|Aaron|Arthur|Ryan|Eric|James|Thomas|Oliver|Rishi)\b/i) ||
            by(/Google US English/i) || en.find(v => /en[-_]US/i.test(v.lang)) || en[0];
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
  const EIGHTH = 0.26;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = 0.75; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = musOn ? 0.16 : 0; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const can = () => ac && sfxOn;

  function tone(o) {
    const f = o.f, t = o.t || 0, d = o.d || 0.2, v = o.v == null ? 0.3 : o.v;
    const st = ac.currentTime + t;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, st);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, st + d);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(v, st + (o.a || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, st + d);
    osc.connect(g); g.connect(o.dest || sfxG);
    osc.start(st); osc.stop(st + d + 0.05);
  }
  function noise(o) {

  const MEL = [
    'E4 - G4 - A4 G4 E4 -', 'D4 - E4 - G4 - E4 D4', 'C4 - E4 - G4 A4 C5 -', 'A4 - G4 - E4 - D4 -',

/* ================= state ================= */
const state = {
  round: 0, hit: 0, hearts: MAX_HEARTS, queue: [], cur: null,
  busy: true, hint: false, playing: false
};
let strokes = [], drawing = false, curStroke = null, lastTick = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= canvases ================= */
let W = 0, H = 0;
function sizeCanvases() {
  W = pad.clientWidth * 2; H = pad.clientHeight * 2;
  pad.width = guide.width = W; pad.height = guide.height = H;
}
sizeCanvases();

function drawStroke(c, s, color, width) {
  if (!s.length) return;
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = color; c.lineWidth = width;
  c.beginPath(); c.moveTo(s[0].x, s[0].y);
  for (let i = 1; i < s.length; i++) c.lineTo(s[i].x, s[i].y);
  if (s.length === 1) c.lineTo(s[0].x + 0.1, s[0].y);
  c.stroke();
}
const INK = '#3b2f9e', INK_W = 15;
function renderPad() {
  ctx.clearRect(0, 0, W, H);
  for (const s of strokes) drawStroke(ctx, s, INK, INK_W);
  $('padHint').style.opacity = strokes.length ? 0 : 1;
}
function renderGuide() {
  gctx.clearRect(0, 0, W, H);
  if (!state.hint || !state.cur) return;
  const pts = Recognizer.guide(state.cur);
  const size = Math.min(W, H) * 0.64;
  gctx.save();
  gctx.setLineDash([24, 20]); gctx.lineWidth = 12; gctx.lineCap = 'round'; gctx.lineJoin = 'round';
  gctx.strokeStyle = 'rgba(70,90,50,.35)';
  gctx.beginPath();
  pts.forEach((p, i) => { const x = W / 2 + p.x * size, y = H / 2 + p.y * size; i ? gctx.lineTo(x, y) : gctx.moveTo(x, y); });
  gctx.closePath(); gctx.stroke(); gctx.restore();
}
function clearPad() { strokes = []; curStroke = null; drawing = false; renderPad(); }

function pos(e) {
  const r = pad.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
pad.addEventListener('pointerdown', e => {
  if (state.busy) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch (_) {}
  drawing = true;
  curStroke = [pos(e)]; strokes.push(curStroke);
  renderPad(); Snd.tick();
});
pad.addEventListener('pointermove', e => {
  if (!drawing || !curStroke) return;

    curStroke.push(p);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = INK_W;
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();

const endDraw = () => { drawing = false; curStroke = null; };
pad.addEventListener('pointerup', endDraw);
pad.addEventListener('pointercancel', endDraw);
pad.addEventListener('contextmenu', e => e.preventDefault());

/* ================= helpers: UI ================= */
function renderHearts(breakIdx) {
  const h = $('hearts'); h.innerHTML = '';
  for (let i = 0; i < MAX_HEARTS; i++) {
    const s = document.createElement('span');
    s.textContent = i < state.hearts ? '❤️' : '🖤';
    if (i >= state.hearts) s.className = 'lost' + (i === breakIdx ? ' pop' : '');
    h.appendChild(s);
  }
}
function renderPips(allDone) {
  const p = $('pips'); p.innerHTML = '';
  for (let i = 0; i < ROUNDS.length; i++) {
    const d = document.createElement('i');
    if (allDone || i < state.round) d.className = 'done'; else if (i === state.round) d.className = 'now';
    p.appendChild(d);
  }
  $('roundTxt').textContent = 'Round ' + (state.round + 1) + '/' + ROUNDS.length;
}
function renderHp() {
  const total = ROUNDS[state.round].hits, left = total - state.hit;
  const hp = $('hpbar'); hp.innerHTML = '🦖 ';
  for (let i = 0; i < total; i++) { const b = document.createElement('i'); if (i >= left) b.className = 'gone'; hp.appendChild(b); }
}
const sctx = $('sample').getContext('2d');
function drawSample(kind) {
  const c = SHAPES[kind], pts = Recognizer.guide(kind), size = 150;
  sctx.clearRect(0, 0, 216, 192);
  sctx.save(); sctx.translate(108, 96);
  sctx.beginPath();
  pts.forEach((p, i) => i ? sctx.lineTo(p.x * size, p.y * size) : sctx.moveTo(p.x * size, p.y * size));

}
function showPrompt() {
  const c = SHAPES[state.cur];
  $('wLine').textContent = c.icon + ' ' + c.weapon;
  drawSample(state.cur);
  const en = $('shapeEN'); en.textContent = c.en; en.style.fontSize = c.en.length > 7 ? '35px' : '44px';
  en.classList.remove('pop'); void en.offsetWidth; en.classList.add('pop');
}
function anim(el, cls, ms) {
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  if (ms) setTimeout(() => el.classList.remove(cls), ms);
}
function toast(main, sub, kind) {
  const t = $('toast');
  t.className = ''; void t.offsetWidth;
  t.innerHTML = main + (sub ? '<small>' + sub + '</small>' : '');
  t.className = 'show ' + (kind || 'good');
}
function banner(big, sub) {
  $('bannerBig').textContent = big; $('bannerSub').textContent = sub;
  const b = $('banner'); b.className = ''; void b.offsetWidth; b.className = 'show';
}
function stageXY(el, fx_, fy_) {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: (r.left - s.left + r.width * fx_) / scale, y: (r.top - s.top + r.height * fy_) / scale };
}
function burst(x, y, list, n, spread) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div'); p.className = 'p';
    p.textContent = list[i % list.length];
    p.style.left = x + 'px'; p.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, d = (spread || 160) * (0.4 + Math.random() * 0.8);
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    p.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
    p.style.fontSize = (22 + Math.random() * 22) + 'px';
    fx.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
function word(x, y, text, color) {
  const w = document.createElement('div'); w.className = 'word'; w.textContent = text;
  if (color) w.style.webkitTextStrokeColor = color;
  w.style.left = x + 'px'; w.style.top = y + 'px';
  fx.appendChild(w); setTimeout(() => w.remove(), 950);
}
function confetti() {
  const list = ['🎉', '⭐', '✨', '🎊', '💛', '🌟'];
  for (let k = 0; k < 6; k++) setTimeout(() => burst(200 + Math.random() * 880, 150 + Math.random() * 250, list, 14, 260), k * 260);
}

/* ================= weapon launch ================= */
function bboxOf(list) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of list) for (const p of s) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}
function launchWeapon(kind) {
  return new Promise(resolve => {
    const cfg = SHAPES[kind];
    const b = bboxOf(strokes), m = 40;
    const cw = b.w + 2 * m, ch = b.h + 2 * m;
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    g.translate(m - b.x0, m - b.y0);
    g.shadowColor = cfg.color; g.shadowBlur = 34;
    for (const s of strokes) drawStroke(g, s, cfg.color, 30);
    g.shadowBlur = 16;
    for (const s of strokes) drawStroke(g, s, '#fff', 12);

    const el = document.createElement('div'); el.className = 'weapon';
    const w = cw / 2, h = ch / 2;
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.appendChild(c);
    const ic = document.createElement('span'); ic.textContent = cfg.icon; ic.style.fontSize = Math.max(40, Math.min(w, h) * 0.45) + 'px';
    el.appendChild(ic);

    const pr = pad.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    const k = pad.clientWidth / W;
    const sx = (pr.left - sr.left) / scale + (b.x0 + b.w / 2) * k;
    const sy = (pr.top - sr.top) / scale + (b.y0 + b.h / 2) * k;
    const target = stageXY($('dinoBody'), 0.5, 0.42);
    const T = r => 'translate(' + (sx - w / 2) + 'px,' + (sy - h / 2) + 'px) rotate(0deg)';
    el.style.setProperty('--t0', T());
    el.style.transform = T();
    fx.appendChild(el);

    clearPad();
    el.classList.add('charge');
    Snd.spark();
    burst(sx, sy, ['✨', '⭐', cfg.icon], 8, 110);

    setTimeout(() => {
      el.classList.remove('charge');
      anim(hero, 'throw', 600);
      Snd.throwW();
      const t0 = performance.now(), DUR = 750;
      let lastSp = 0;
      (function stepFn(now) {
        const t = Math.min(1, (now - t0) / DUR);
        const e = t * t * (3 - 2 * t);
        const x = sx + (target.x - sx) * e;
        const y = sy + (target.y - sy) * e - Math.sin(Math.PI * t) * 150;
        el.style.transform = 'translate(' + (x - w / 2) + 'px,' + (y - h / 2) + 'px) rotate(' + (t * 600) + 'deg) scale(' + (1.1 - 0.4 * t) + ')';
        if (now - lastSp > 70) { lastSp = now; burst(x, y, ['✨', '·', '⭐'], 1, 50); }
        if (t < 1) requestAnimationFrame(stepFn); else { el.remove(); resolve(target); }
      })(t0);
    }, 400);
  });
}

/* ================= game flow ================= */
function makeQueue(r) {
  const q = []; let prev = null;
  for (let i = 0; i < r.hits; i++) {
    let s;
    if (i === 0 && r.first) s = r.first;
    else do { s = r.pool[Math.floor(Math.random() * r.pool.length)]; } while (s === prev && r.pool.length > 1);
    q.push(s); prev = s;
  }
  return q;
}

async function startRound(i) {
  state.round = i; state.hit = 0; state.busy = true;
  const r = ROUNDS[i];
  state.queue = makeQueue(r);
  dino.className = 'char';
  $('dinoBody').style.setProperty('--hue', r.hue + 'deg');
  $('dinoBody').style.setProperty('--s', r.scale);
  $('hpbar').style.setProperty('--s', r.scale);
  void dino.offsetWidth; dino.classList.add('enter');
  setTimeout(() => dino.classList.remove('enter'), 1000);
  renderPips(); renderHp(); clearPad(); state.cur = null; renderGuide();
  banner('ROUND ' + (i + 1), r.name + (r.boss ? ' 👑' : ''));
  setTimeout(() => Snd.roar(), 350);
  await wait(1900);
  nextShape();
}

function nextShape() {
  state.cur = state.queue[state.hit];
  clearPad(); showPrompt(); renderGuide();
  state.busy = false;
  setTimeout(() => Snd.speak('Draw a ' + SHAPES[state.cur].say), 250);
}

function pickBestLabel(res) {
  if (res.best && res.best !== state.cur && res.bestScore >= 55) return 'That looks more like a ' + SHAPES[res.best].en + '!';
  return 'Try again! You can do it!';
}

async function attack() {
  if (state.busy || !state.playing) return;
  Snd.init();
  if (!strokes.length) { toast('Draw first!', 'Look at the picture and copy it', 'info'); Snd.click(); return; }
  const minSize = Math.min(W, H) * 0.2;
  const res = Recognizer.analyze(strokes, minSize);
  if (!res.ok) { toast('Draw bigger! ✏️', 'Draw the whole shape', 'info'); Snd.click(); return; }
  const j = Recognizer.judge(state.cur, res);
  state.busy = true;
  if (j.pass) await success(j.percent); else await fail(res);
}

async function success(pct) {
  const kind = state.cur;
  Snd.correct();
  toast(pct + '% match!', PRAISE[Math.floor(Math.random() * PRAISE.length)] + ' ' + SHAPES[kind].icon, 'good');
  setTimeout(() => Snd.speak(CHEER[Math.floor(Math.random() * CHEER.length)]), 500);
  const target = await launchWeapon(kind);
  // impact
  Snd.hit();
  anim(dino, 'hit', 520);
  anim(world, 'shake', 460);
  burst(target.x, target.y, ['💥', '✨', '⭐', SHAPES[kind].icon], 14, 190);
  word(target.x, target.y - 40, ['POW!', 'BAM!', 'BOOM!'][Math.floor(Math.random() * 3)]);
  state.hit++; renderHp();
  await wait(900);

  if (state.hit >= ROUNDS[state.round].hits) {
    // dino defeated
    Snd.roundWin();
    anim(dino, 'die'); dino.classList.add('die');
    anim(hero, 'cheer', 1000);
    burst(target.x, target.y + 40, ['⭐', '🌟', '✨', '💫'], 18, 220);
    if (state.round === ROUNDS.length - 1) { await wait(1400); return win(); }
    toast('Dinosaur defeated! 🎉', 'Round ' + (state.round + 1) + ' complete', 'good');
    setTimeout(() => Snd.speak('You did it!'), 400);
    await wait(2300);
    return startRound(state.round + 1);
  }
  nextShape();
}

async function fail(res) {
  Snd.wrong();
  Snd.roar();
  anim(dino, 'lunge', 1200);
  word(stageXY(dino, 0.5, 0.2).x - 120, 230, 'RAWR!', '#6a040f');
  await wait(340);
  // dino reaches the hero
  Snd.hurt(); Snd.heart();
  anim(hero, 'hurt', 720);
  anim(world, 'shake', 460);
  state.hearts--;
  renderHearts(state.hearts);
  burst(stageXY(hero, 0.6, 0.45).x, stageXY(hero, 0.6, 0.45).y, ['💢', '💥', '⭐'], 9, 140);
  toast('Oops! Not quite 😢', pickBestLabel(res), 'bad');
  setTimeout(() => Snd.speak('Oh no!'), 300);
  await wait(1250);
  if (state.hearts <= 0) return lose();
  clearPad();
  state.busy = false;
  setTimeout(() => Snd.speak('Draw a ' + SHAPES[state.cur].say), 200);
}

function endScreen(title, sub, stars) {
  $('endTitle').textContent = title; $('endSub').textContent = sub; $('stars').textContent = stars;
  $('endOv').classList.remove('hidden');
}
function win() {
  state.playing = false; state.busy = true;
  renderPips(true);
  Snd.win(); confetti();
  setTimeout(() => Snd.speak('You win!'), 600);
  const n = Math.max(1, state.hearts);
  endScreen('🏆 You win!', 'You are the bravest warrior in the jungle!', '⭐'.repeat(n) + '☆'.repeat(3 - n));
}
function lose() {
  state.playing = false; state.busy = true;
  hero.classList.add('down');
  burst(stageXY(hero, 0.62, 0.12).x, stageXY(hero, 0.62, 0.12).y, ['💫', '💫', '⭐'], 6, 70);
  Snd.lose();
  setTimeout(() => Snd.speak('Try again!'), 900);
  setTimeout(() => endScreen('😢 Out of hearts!', 'The dinosaur won... Try again!', '💔'), 700);
}

function newGame() {
  Snd.init(); Snd.startMusic();
  $('endOv').classList.add('hidden');
  $('startOv').classList.add('hidden');
  hero.className = 'char';
  state.hearts = MAX_HEARTS; state.round = 0; state.hit = 0; state.playing = true; state.busy = true;
  state.hint = false; $('btnHint').classList.remove('on');
  renderHearts(); renderPips();
  startRound(0);
}

/* ================= buttons ================= */
$('btnStart').addEventListener('click', newGame);
$('btnAgain').addEventListener('click', newGame);
$('btnGo').addEventListener('click', attack);
$('btnClear').addEventListener('click', () => { if (state.busy) return; Snd.init(); Snd.click(); clearPad(); });
$('btnHint').addEventListener('click', () => {
  if (state.busy || !state.cur) return;
  Snd.init(); Snd.click();
  state.hint = !state.hint; $('btnHint').classList.toggle('on', state.hint); renderGuide();
});
$('btnSpeak').addEventListener('click', () => { Snd.init(); if (state.cur) Snd.speak('Draw a ' + SHAPES[state.cur].say); });
$('btnMusic').addEventListener('click', () => { Snd.init(); const on = Snd.toggleMusic(); $('btnMusic').classList.toggle('off', !on); });
$('btnSound').addEventListener('click', () => { Snd.init(); const on = Snd.toggleSfx(); $('btnSound').classList.toggle('off', !on); $('btnSound').textContent = on ? '🔊' : '🔇'; });

renderHearts(); renderPips(); renderHp();

/* handy hooks for testing */
window.__game = { state, attack, newGame, get strokes() { return strokes; }, set strokes(v) { strokes = v; renderPad(); }, size: () => ({ W, H }) };
})();
</script>
</body>
