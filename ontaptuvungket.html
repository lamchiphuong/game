const bar0=()=>`<div class="bar"><span style="font-size:26px">${S.a}</span><b>${S.n}</b><span><button class="btn w" style="padding:4px 10px" onclick="S.snd=!S.snd;save();this.textContent=S.snd?'🔊':'🔇'">${S.snd?'🔊':'🔇'}</button> <span class="coin">🪙 ${S.c}</span></span></div>`;

function start(){
 A.innerHTML=`<div class="card center"><h1>🗺️ KET Quest</h1><p>Chinh phục 10 hòn đảo, học 100 từ và 100 mẫu câu Cambridge A2 Key!</p><b>1. Chọn nhân vật</b><div class="stage">${AVS.map(a=>`<div class="av ${a==S.a?'on':''}" onclick="S.a='${a}';beep(660);start()">${a}</div>`).join('')}</div><b>2. Tên của bạn</b><input type="text" id="nm" maxlength="14" placeholder="Nhập tên..." value="${S.n}" style="margin:8px 0 14px"><br><button class="btn g" onclick="S.n=$('#nm').value.trim();if(!S.a)S.a=AVS[0];if(!S.n)return $('#nm').focus();save();win();home()">Bắt đầu hành trình</button></div>`}

function home(){
 let h=bar()+`<div class="map" style="margin-top:12px"><span class="cl" style="top:20px">☁️</span><span class="cl" style="top:520px;animation-delay:-6s">☁️</span><span class="cl" style="top:1000px;animation-delay:-9s">☁️</span><span class="fish" style="left:8%;top:260px">🐟</span><span class="fish" style="right:10%;top:700px">🐳</span>`;
 MAPS.forEach((m,i)=>{const open=i<S.u,canBuy=i==S.u&&full(i-1),cur=open&&!full(i)&&(i==S.u-1);
  h+=`<div class="node ${i%2?'r':''} ${open?'':'lock'}" style="--c:${m[2]}" onclick="${open?`mapScr(${i})`:canBuy?`buy(${i})`:`beep(180);pop('🔒 Hoàn thành đảo trước')`}">${cur?`<span class="pl">${S.a}</span>`:''}<div class="isl"><div class="base"></div><div class="em">${open?m[1]:'🔒'}</div></div><span class="tag">${i+1}. ${m[0]}</span><br><span class="dots">${open?[0,1,2,3].map(k=>done(i,k)?'⭐':'☆').join(''):canBuy?'🪙 40 để mở':''}</span></div>${i<9?'<div class="foot">👣</div>':''}`});
 A.innerHTML=h+'</div>';
 const c=document.querySelector('.pl');if(c)c.scrollIntoView({block:'center'})}
function buy(i){if(S.c>=40){S.c-=40;S.u=i+1;save();win();pop('🎉 Mở khóa đảo mới!');home()}else{bad();pop('Cần 40 🪙')}}

function mapScr(i){BK=home;
 const m=MAPS[i],ws=WD.slice(i*10,i*10+10),M=[["📖","Từ vựng Anh → Việt","Chọn nghĩa đúng"],["🔄","Từ vựng Việt → Anh","Chọn từ tiếng Anh"],["✍️","Gõ từ tiếng Anh","Có gợi ý từng chữ"],["🧩","Mẫu câu","Chọn cấu trúc đúng"]];
 A.innerHTML=bar()+`<div class="card"><button class="btn w" onclick="home()" style="padding:6px 12px">← Bản đồ</button><h2 style="margin-top:10px">${m[1]} ${m[0]}</h2>${M.map((x,k)=>`<div class="mis" onclick="play(${i},${k})"><span class="ic">${x[0]}</span><div style="flex:1"><b>${x[1]}</b><small>${x[2]} · +${k==2?3:2} 🪙/câu</small></div><span>${done(i,k)?'✅':'▶️'}</span></div>`).join('')}<p style="font-size:14px">Đạt từ 7/10 để hoàn thành nhiệm vụ (+10 🪙 lần đầu). Xong cả 4 nhiệm vụ để mở đảo tiếp theo!</p></div><div class="card"><h3>📚 Học nhanh (bấm để nghe)</h3><table>${ws.map(w=>`<tr onclick="say('${w.w}')" style="cursor:pointer"><td>🔊 <b>${w.w}</b> <small>${w.t}</small></td><td>${w.m}</td></tr>`).join('')}</table></div><div class="card"><h3>🧩 Mẫu câu của đảo</h3><table>${SD.slice(i*10,i*10+10).map(s=>`<tr onclick="say('${s.e.replace(/'/g,'')}')" style="cursor:pointer"><td>🔊 ${s.e}</td><td>${s.v}</td></tr>`).join('')}</table></div>`}

let G;
function play(i,k){
 const ws=WD.slice(i*10,i*10+10),ss=SD.slice(i*10,i*10+10);
 const others=(c,key)=>{let p=WD.filter(x=>x!==c&&x.t==c.t);if(p.length<3)p=WD.filter(x=>x!==c);return sh(p).slice(0,3).map(x=>x[key])};
 let items=sh(k<3?ws:ss).map(x=>k==0?{q:x.w,say:x.w,a:x.m,o:sh([x.m,...others(x,'m')])}:k==1?{q:x.m,a:x.w,say:x.w,o:sh([x.w,...others(x,'w')])}:k==2?{q:x.m,a:x.w,say:x.w,type:1,tt:x.t}:{q:x.v,a:x.e,say:x.e,s:1,o:sh([x.e,...sh(ss.filter(y=>y!==x)).slice(0,3).map(y=>y.e)])});
 G={i,k,items,n:0,ok:0,earn:0,h:0};ask()}
function ask(){
 const it=G.items[G.n],pct=G.n/10*100;
 let h=bar()+`<div class="card"><div class="pb"><i style="width:${pct}%"></i></div><p class="center" style="margin:6px 0">Câu ${G.n+1}/10 · ${MAPS[G.i][0]}</p>`;
 if(it.type){G.h=0;h+=`<div class="q">${it.q}</div><div class="center">(${it.tt})</div><div class="hint" id="hn">${it.a.split('').map(()=>'_').join(' ')}</div><input type="text" id="ans" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Gõ từ tiếng Anh..."><div class="row"><button class="btn w" onclick="hint()">💡 Gợi ý</button><button class="btn g" onclick="chk()">Kiểm tra</button></div>`}
 else h+=`<div class="q ${it.s?'s':''}">${it.q}</div>${G.k==0?`<div class="center"><button class="btn w" onclick="say('${it.say}')">🔊 Nghe</button></div>`:''}<div id="os">${it.o.map((o,j)=>`<button class="opt" data-o="${j}" onclick="pick(${j})">${o}</button>`).join('')}</div>`;
 A.innerHTML=h+'</div>';
 if(G.k==0)say(it.say);const a=$('#ans');if(a){a.focus();a.onkeydown=e=>{if(e.key=='Enter')chk()}}}
function hint(){const it=G.items[G.n];G.h=Math.min(G.h+1,it.a.length-1);$('#hn').textContent=it.a.split('').map((c,j)=>j<G.h?c:'_').join(' ');beep(500)}
function fin(good,extra){
 const it=G.items[G.n];if(good){G.ok++;const p=G.k==2?(G.h?1:3):2;G.earn+=p;S.c+=p;pop('+'+p+' 🪙');win()}else bad();
 if(G.k!=0)say(it.say);
 setTimeout(()=>{G.n++;G.n<10?ask():result()},good?900:1700)}
function pick(j){const it=G.items[G.n],b=document.querySelectorAll('.opt');b.forEach((x,n)=>{x.disabled=true;if(it.o[n]==it.a)x.classList.add('ok')});const good=it.o[j]==it.a;if(!good)b[j].classList.add('no');fin(good)}
function chk(){const it=G.items[G.n],v=$('#ans').value.trim().toLowerCase(),good=v==it.a;$('#ans').disabled=true;$('#hn').innerHTML=good?`<span style="color:#23864f">${it.a}</span>`:`<span style="color:#c24a2c">${it.a}</span>`;fin(good)}
function result(){
 const pass=G.ok>=7,first=pass&&!done(G.i,G.k);if(first){S.d[G.i+'-'+G.k]=1;S.c+=10;G.earn+=10}save();pass?win():bad();
 A.innerHTML=bar()+`<div class="card center"><div class="hero">${pass?S.a:'😅'}</div><h2>${pass?'Xuất sắc!':'Cố lên nào!'}</h2><h1>${G.ok}/10</h1><p>Nhận được <b>🪙 ${G.earn}</b>${first?' (gồm thưởng +10 hoàn thành)':''}</p>${full(G.i)&&G.i<9&&S.u==G.i+1?'<p><b>🎊 Hoàn thành đảo! Về bản đồ để mở đảo tiếp theo.</b></p>':''}<div class="row"><button class="btn w" onclick="play(${G.i},${G.k})">Chơi lại</button><button class="btn g" onclick="mapScr(${G.i})">Tiếp tục</button></div></div>`}
S.w=S.w||{};let BK=null;
const bar=()=>`<div class="bar">${BK?`<button class="btn w sm" onclick="BK()">←</button>`:''}<button class="btn w sm" onclick="home()">🏠</button><span class="who">${S.a} ${S.n}</span><button class="btn w sm" onclick="S.snd=!S.snd;save();this.textContent=S.snd?'🔊':'🔇'">${S.snd?'🔊':'🔇'}</button><span class="coin">🪙 ${S.c}</span></div>`;
function home(){BK=null;
 const P=[[30,7],[68,16.5],[30,26],[70,35.5],[30,45],[68,54.5],[30,64],[68,73.5],[32,83],[60,92]],wc=Object.keys(S.w).length;
 const DC=[[10,88,'🌴'],[90,94,'🌊'],[8,62,'🐳'],[92,50,'⛵'],[10,36,'🌴'],[90,26,'🐟'],[8,10,'☁️'],[88,6,'🌴']];
 const nodes=P.map((p,i)=>{const m=MAPS[i],open=i<S.u,canBuy=i==S.u&&full(i-1),cur=open&&!full(i)&&i==S.u-1;
  return `<div class="nd3 ${open?'':'lock'}" style="left:${p[0]}%;top:${p[1]}%;--c:${m[2]}" onclick="${open?`mapScr(${i})`:canBuy?`buy(${i})`:`beep(180);pop('🔒 Hoàn thành đảo trước')`}"><div class="disk"></div><div class="up"><span class="tag">${i+1}. ${m[0]}</span><br><span class="dots">${open?[0,1,2,3].map(k=>done(i,k)?'⭐':'☆').join(''):canBuy?'🪙 40 để mở':'🔒'}</span><div class="em">${open?m[1]:'🔒'}</div></div>${cur?`<div class="up pin">${S.a}</div>`:''}</div>`}).join('');
 A.innerHTML=bar()+`<div class="card center" style="margin:10px 0"><button class="btn g" onclick="reviewMenu()">🔁 Ôn lại${wc?` (${wc} câu cần ôn)`:''}</button></div><div class="world"><div class="board"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 14" vector-effect="non-scaling-stroke"/></svg>${DC.map(d=>`<div class="nd3" style="left:${d[0]}%;top:${d[1]}%"><div class="up dc">${d[2]}</div></div>`).join('')}${nodes}</div></div>`;
 setTimeout(()=>{const c=document.querySelector('.pin');if(c)c.scrollIntoView({block:'center'})},60)}
function mk(k,x){const s=k==3,i=(s?SD:WD).indexOf(x),f=k==0?'m':'w';let o=null;
 if(s){const g=Math.floor(i/10)*10;o=sh([x.e,...sh(SD.slice(g,g+10).filter(y=>y!==x)).slice(0,3).map(y=>y.e)])}
 else if(k<2){let p=WD.filter(y=>y!==x&&y.t==x.t);if(p.length<3)p=WD.filter(y=>y!==x);o=sh([x[f],...sh(p).slice(0,3).map(y=>y[f])])}
 return{id:(s?'s':'w')+i,k,q:k==0?x.w:s?x.v:x.m,a:s?x.e:k==0?x.m:x.w,say:s?x.e:x.w,type:k==2,tt:x.t,s,o}}
function play(i,k){G={i,k,items:sh(k<3?WD.slice(i*10,i*10+10):SD.slice(i*10,i*10+10)).map(x=>mk(k,x)),n:0,ok:0,earn:0,h:0};BK=()=>mapScr(i);ask()}
function ask(){const it=G.items[G.n],N=G.items.length;
 let h=bar()+`<div class="card"><div class="pb"><i style="width:${G.n/N*100}%"></i></div><p class="center" style="margin:6px 0">${G.rv?'🔁 Ôn lại':MAPS[G.i][0]} · Câu ${G.n+1}/${N}</p>`;
 if(it.type){G.h=0;h+=`<div class="q">${it.q}</div><div class="center">(${it.tt})</div><div class="hint" id="hn">${it.a.split('').map(()=>'_').join(' ')}</div><input type="text" id="ans" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Gõ từ tiếng Anh..."><div class="row"><button class="btn w" onclick="hint()">💡 Gợi ý</button><button class="btn g" onclick="chk()">Kiểm tra</button></div>`}
 else h+=`<div class="q ${it.s?'s':''}">${it.q}</div>${it.k==0?`<div class="center"><button class="btn w" onclick="say('${it.say}')">🔊 Nghe</button></div>`:''}<div id="os">${it.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${o}</button>`).join('')}</div>`;
 A.innerHTML=h+'</div>';if(it.k==0)say(it.say);const a=$('#ans');if(a){a.focus();a.onkeydown=e=>{if(e.key=='Enter')chk()}}}
function fin(good){const it=G.items[G.n];
 if(good){G.ok++;const p=it.k==2?(G.h?1:3):2;G.earn+=p;S.c+=p;pop('+'+p+' 🪙');win();delete S.w[it.id]}else{bad();S.w[it.id]=1}
 save();if(it.k!=0)say(it.say);setTimeout(()=>{G.n++;G.n<G.items.length?ask():result()},good?900:1700)}
function result(){const N=G.items.length,pass=G.ok>=Math.ceil(N*.7),first=!G.rv&&pass&&!done(G.i,G.k);
 if(first){S.d[G.i+'-'+G.k]=1;S.c+=10;G.earn+=10}save();pass?win():bad();BK=G.rv?reviewMenu:()=>mapScr(G.i);
 A.innerHTML=bar()+`<div class="card center"><div class="hero">${pass?S.a:'😅'}</div><h2>${pass?'Xuất sắc!':'Cố lên nào!'}</h2><h1>${G.ok}/${N}</h1><p>Nhận được <b>🪙 ${G.earn}</b>${first?' (gồm thưởng +10 hoàn thành)':''}</p>${!G.rv&&full(G.i)&&G.i<9&&S.u==G.i+1?'<p><b>🎊 Hoàn thành đảo! Về bản đồ để mở đảo tiếp theo.</b></p>':''}<div class="row"><button class="btn w" onclick="${G.rv?'reviewMenu()':`play(${G.i},${G.k})`}">${G.rv?'Menu ôn tập':'Chơi lại'}</button><button class="btn g" onclick="${G.rv?`review('${G.m}')`:`mapScr(${G.i})`}">${G.rv?'Ôn tiếp':'Tiếp tục'}</button></div></div>`}
function reviewMenu(){BK=home;const w=Object.keys(S.w).length;
 A.innerHTML=bar()+`<div class="card"><h2>🔁 Ôn lại</h2><div class="mis" onclick="review('w')"><span class="ic">❌</span><div><b>Ôn câu đã làm sai</b><small>${w} câu đang chờ · làm đúng sẽ được xóa khỏi danh sách</small></div></div><div class="mis" onclick="review('m')"><span class="ic">🎲</span><div><b>Ôn tổng hợp</b><small>10 câu ngẫu nhiên từ các đảo đã mở</small></div></div><div class="mis" onclick="flash()"><span class="ic">🃏</span><div><b>Thẻ lật từ vựng</b><small>Chạm để xem nghĩa, nghe phát âm</small></div></div></div>`}
function review(m){G={rv:1,m,i:0,k:-1,n:0,ok:0,earn:0,h:0};BK=reviewMenu;const U=S.u*10,R=n=>Math.floor(Math.random()*n);let it=[];
 if(m=='w')it=Object.keys(S.w).slice(0,10).map(id=>{const s=id[0]=='s';return mk(s?3:R(3),(s?SD:WD)[+id.slice(1)])});
 else for(let j=0;j<10;j++)it.push(Math.random()<.3?mk(3,SD[R(U)]):mk(R(3),WD[R(U)]));
 if(!it.length){bad();return pop('Chưa có câu sai 🎉')}G.items=sh(it);ask()}
let F;function flash(){BK=reviewMenu;F={p:sh(WD.slice(0,S.u*10)),n:0,f:0};fc();say(F.p[0].w)}
function fc(){const w=F.p[F.n],L=F.p.length;A.innerHTML=bar()+`<div class="card center"><p>Thẻ ${F.n+1}/${L}</p><div class="fcard" onclick="F.f=!F.f;fc()">${F.f?`<div><b style="font-size:24px">${w.m}</b><br><small>${w.t}</small></div>`:`<div><b style="font-size:36px">${w.w}</b><br><small>Chạm để lật</small></div>`}</div><div class="row"><button class="btn w" onclick="F.n=(F.n+L-1)%L;F.f=0;fc()">←</button><button class="btn w" onclick="say('${w.w}')">🔊</button><button class="btn g" onclick="F.n=(F.n+1)%L;F.f=0;fc();say(F.p[F.n].w)">→</button></div></div>`}
S.a&&S.n?home():start();
</script></body></html>
